<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!--
  体能系统 v4.1 · 个人户外体能 PWA（单文件全内联，零外部依赖）
  网络白名单仅两处：① https://api.github.com ② CONFIG.GIST_RAW_URL
  运行要求：http(s) 访问（GitHub Pages 或本地 python -m http.server），file:// 直开无 Web Crypto/SW。
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="个人户外体能训练记录与健康数据">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<title>体能系统</title>
<style>
/* ============ 设计系统（第三部分 token，全站只用这些值，禁止硬编码色值） ============ */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --text2:#8E8E93; --line:#E5E5EA;
  --accent:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --purple:#5E5CE6; --teal:#30B0C7; --pink:#FF375F; --blue:#007AFF;
  --glass:rgba(255,255,255,.8); --accent-soft:rgba(0,122,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --r-card:16px; --r-btn:12px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --text2:#98989F; --line:#38383A;
    --glass:rgba(28,28,30,.8);
  }
}
/* P1-3 外观设置：手动浅色/深色覆盖（优先级高于系统媒体查询） */
html[data-theme="dark"]{--bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --text2:#98989F; --line:#38383A; --glass:rgba(28,28,30,.8)}
html[data-theme="light"]{--bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --text2:#8E8E93; --line:#E5E5EA; --glass:rgba(255,255,255,.8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  .btn-primary:active,.btn-ghost:active,.chip:active,.tab:active,.ci-btn:active,.link-btn:active,.k-head:active{opacity:.62;transform:scale(.985)} /* v4.1 好用度：全局按压反馈 */
html,body{height:100%}
body{
  font-family:-apple-system,system-ui,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
}
button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit}
input,select,textarea{font-family:inherit}
[hidden]{display:none !important}
/* 字阶：页面标题28/700 大数字34/700 卡片标题17/600 正文15/400 辅助13/400 Tab标签10/500 */
.page-title{font-size:28px;font-weight:700;line-height:1.25}
.big-num{font-size:34px;font-weight:700;line-height:1.15}
.card-title{font-size:17px;font-weight:600}
.sub{font-size:13px;color:var(--text2);line-height:1.7}
.tab-label{font-size:10px;font-weight:500}
/* 布局 */
#app{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
#topbar{
  position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:0.5px solid var(--line);
}
#topTitle{font-size:17px;font-weight:600}
.top-right{display:flex;align-items:center;gap:10px}
#syncBadge{font-size:13px;color:var(--text2)}
#syncBadge.pending,#syncBadge.stale{color:var(--red)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--accent)}
main{padding:16px 16px 24px;max-width:600px;margin:0 auto}
.page[hidden]{display:none}
/* 卡片：无边框，微阴影 */
.card{background:var(--card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
/* 图标气泡 36×36 圆角10 彩色底+白线性图标 */
.bubble{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.bubble svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bg-purple{background:var(--purple)} .bg-teal{background:var(--teal)} .bg-pink{background:var(--pink)}
.bg-blue{background:var(--blue)} .bg-orange{background:var(--orange)} .bg-gray{background:var(--text2)}
.bg-green{background:var(--green)} .bg-red{background:var(--red)}
/* 按钮/输入/胶囊 */
.btn-primary{display:block;width:100%;min-height:44px;background:var(--accent);color:#fff;border-radius:var(--r-btn);font-size:17px;font-weight:600;text-align:center}
.btn-primary:disabled{opacity:.4}
.btn-ghost{display:block;width:100%;min-height:44px;background:var(--card);color:var(--accent);border-radius:var(--r-btn);font-size:15px;font-weight:500;text-align:center;border:1px solid var(--line)}
.link-btn{display:block;width:100%;min-height:44px;color:var(--accent);font-size:15px;text-align:center}
.btn-mini{display:inline-block;min-height:44px;padding:10px 16px;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-btn);font-size:15px;font-weight:500;text-align:center}
.chip{min-height:44px;padding:10px 18px;border-radius:var(--r-pill);background:var(--card);color:var(--text);font-size:15px;border:1px solid var(--line)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;min-height:44px;background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r-btn);padding:10px 12px;font-size:15px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field input[readonly]{background:var(--bg);color:var(--text2)}
.row-between{display:flex;align-items:center;justify-content:space-between}
.row-between>label{margin:0}
/* 开关 */
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.switch .sl:before{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:var(--card);top:2px;left:2px;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:.15s}
.switch input:checked + .sl{background:var(--green)}
.switch input:checked + .sl:before{transform:translateX(18px)}
/* 折叠区 */
details.fold{margin-top:10px;background:var(--bg);border-radius:12px;padding:0 12px}
details.fold summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500;list-style:none;cursor:pointer}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary:after{content:'›';color:var(--text2);font-size:18px;transform:rotate(90deg)}
details.fold[open] summary:after{transform:rotate(-90deg)}
details.fold .fold-body{padding:2px 0 12px;font-size:14px;line-height:1.9;color:var(--text)}
/* 底部 Tab 栏：毛玻璃 5 Tab */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:0.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
#tabbar .tab{flex:1;min-height:52px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--text2)}
#tabbar .tab.on{color:var(--accent)}
#tabbar .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
/* 全屏层 */
.fullscreen{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.fs-head{display:flex;align-items:center;gap:10px;margin:8px 0 12px;min-height:44px}
.fs-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;margin-left:-10px}
.fs-steps{font-size:13px;color:var(--text2)}
.dots{display:flex;gap:6px;justify-content:flex-start;margin:0 0 14px 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:16px;border-radius:3px}
/* 选项卡（引导第3步伤病确认） */
.opt-card{display:flex;align-items:center;gap:12px;min-height:56px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-btn);padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;font-size:15px}
.opt-card.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-card .oc-t{font-weight:600}
.opt-card .oc-d{font-size:13px;color:var(--text2)}
/* 解锁页 S0 */
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:380px;text-align:center}
.gate-logo{width:72px;height:72px;margin:0 auto 16px}
.gate-title{font-size:28px;font-weight:700;margin-bottom:8px}
.gate-sub{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.8;text-align:left}
.gate-box .field{text-align:left;margin-bottom:20px}
.gate-box .btn-primary{margin-bottom:6px}
.gate-msg{margin-top:14px;font-size:13px;color:var(--red);min-height:19px;white-space:pre-wrap;line-height:1.7;text-align:center}
/* 状态卡：圆形发光灯 + 状态底色 */
.light-card{display:flex;gap:12px;align-items:flex-start}
.light-card.lv-grn{background:rgba(52,199,89,.08)}
.light-card.lv-yel{background:rgba(255,149,0,.08)}
.light-card.lv-red{background:rgba(255,59,48,.08)}
.lamp{width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px;background:var(--green);box-shadow:0 0 12px rgba(52,199,89,.85)}
.light-card.lv-yel .lamp{background:var(--orange);box-shadow:0 0 12px rgba(255,149,0,.85)}
.light-card.lv-red .lamp{background:var(--red);box-shadow:0 0 12px rgba(255,59,48,.85)}
#topLamp{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line);display:inline-block}
/* 就医提示条 / 长文本 */
.callout-warn{background:rgba(255,149,0,.12);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.8;margin-top:8px}
.prose{font-size:14px;line-height:1.9;color:var(--text)}
.prose b{font-weight:600}
/* 训练执行模式（全屏） */
#workout{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#workout[hidden]{display:none}
.wk-name{font-size:34px;font-weight:700;line-height:1.3}
.wk-set{font-size:15px;color:var(--text2);margin:8px 0 20px}
.wk-ring{position:relative;width:220px;height:220px;margin-bottom:24px}
.wk-ring svg{width:100%;height:100%}
.wk-ring .wt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;font-weight:700;line-height:1.1}
.wk-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.wk-bar{width:220px;height:6px;border-radius:3px;background:var(--line);margin:0 auto 18px;overflow:hidden}
.wk-bar>div{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.wk-goal{font-size:28px;font-weight:700;color:var(--orange);margin:-12px 0 18px}
.wk-tip{font-size:14px;color:var(--text2);max-width:320px;margin:0 auto 20px;line-height:1.7}
.wr-badge{width:64px;height:64px;margin:4px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.wr-num{background:var(--bg);border-radius:12px;padding:12px 6px;text-align:center}
.wr-v{font-size:20px;font-weight:700}
.wr-l{font-size:12px;color:var(--text2);margin-top:2px}
/* 动作要领提示弹窗（替代原火柴人动画演示） */
.tip-row{display:flex;gap:10px;margin-bottom:9px;font-size:14px;line-height:1.85}
.tip-k{flex:none;width:52px;color:var(--text2);font-size:13px}
.tip-v{flex:1}
/* 阶段升级动画 */
@keyframes phup{0%{transform:translateY(24px) scale(.85);opacity:0}18%{transform:translateY(0) scale(1.04);opacity:1}82%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-12px) scale(1);opacity:0}}
#phaseUp{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;pointer-events:none}
#phaseUp .pu{background:var(--card);border-radius:20px;padding:26px 38px;box-shadow:0 8px 30px rgba(0,0,0,.18);text-align:center;animation:phup 2.2s ease forwards}
#phaseUp .pu-t{font-size:14px;color:var(--text2)}
#phaseUp .pu-n{font-size:34px;font-weight:700;color:var(--accent);margin:2px 0}
/* 打卡日历热力（连续越久颜色越深） */
.cal .d.t1{background:rgba(0,122,255,.35)}
.cal .d.t2{background:rgba(0,122,255,.62);color:#fff}
.cal .d.t3{background:var(--blue);color:#fff}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:44px;background:transparent;border:0;padding:0}
.light-main{flex:1}
.light-name{font-size:17px;font-weight:600;margin-bottom:2px}
/* 最近5天打卡格子（18×18 圆角4） */
.streak{display:flex;gap:4px;align-items:center;flex:none}
.streak i{width:18px;height:18px;border-radius:4px;background:var(--line);display:flex;align-items:center;justify-content:center;font-style:normal}
.streak i.o-on{background:var(--orange)}
.streak i.p-on{background:var(--purple)}
.streak i.rest:after{content:'';width:10px;height:2px;border-radius:1px;background:var(--text2)}
.streak i.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
/* 力量动作勾选（微交互：150ms 缩放填充） */
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--line)}
.check-item:last-child{border-bottom:0}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:transform .15s ease-out,background .15s ease-out,border-color .15s}
.ck svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on svg{opacity:1}
.check-item:active .ck{transform:scale(.88)}
.ci-main{flex:1}
.ci-name{font-size:15px;font-weight:500}
.ci-sub{font-size:13px;color:var(--text2);margin-top:1px}
.ci-btns{display:flex;gap:6px;flex:none}
.ci-btn{min-width:44px;min-height:44px;padding:4px 8px;border-radius:8px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:500}
/* 打卡日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10px;color:var(--text2);text-align:center;padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;min-height:32px;color:var(--text)}
.cal .d.train{background:var(--blue);color:#fff}
.cal .d.rehab{background:var(--accent-soft)}
.cal .d.rest{background:var(--line);color:var(--text2)}
.cal .d.off{visibility:hidden}
.cal .d.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
/* 能力维度 5 圆点 */
.dim-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:0.5px solid var(--line);min-height:44px}
.dim-row:last-child{border-bottom:0}
.dim-name{flex:1;font-size:15px}
.dim-note{font-size:12px;color:var(--orange)}
.dots5{display:flex;gap:3px;flex:none}
.dots5 i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots5 i.f{background:var(--accent)}
.dim-na{font-size:12px;color:var(--text2);flex:none}
/* 进度条 / 环 */
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--teal);border-radius:3px}
/* 设置分组行（档案页） */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;border-bottom:0.5px solid var(--line);font-size:15px}
.set-row:last-child{border-bottom:0}
.set-row .sr-k{color:var(--text)}
.set-row .sr-v{color:var(--text2);text-align:right;font-size:14px}
/* 对比表 */
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:0.5px solid var(--line);text-align:left}
.cmp th{color:var(--text2);font-weight:500;font-size:12px}
.up{color:var(--green)} .down{color:var(--red)} .same{color:var(--text2)}
/* 空状态（首日） */
.empty-card{text-align:center;padding:32px 16px}
.empty-card svg{width:56px;height:56px;stroke:var(--text2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
/* 知识卡 */
.k-search{width:100%;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-btn);padding:10px 14px;font-size:15px;outline:none;margin-bottom:12px;color:var(--text)}
.k-group{font-size:13px;color:var(--text2);margin:16px 4px 8px}
.k-card .k-head{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin:0;cursor:pointer}
.k-card .k-head .k-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.k-card .k-head:after{content:'›';color:var(--text2);font-size:18px;transform:rotate(90deg)}
.k-card.open .k-head:after{transform:rotate(-90deg)}
.k-body{display:none;font-size:14px;line-height:2;color:var(--text);margin-top:10px}
.k-card.open .k-body{display:block}
.k-body b{font-weight:600}
/* 模态/提示/吸底保存 */
#modalWrap{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
#modalBox{width:100%;max-width:340px;max-height:78vh;overflow:auto;background:var(--card);border-radius:var(--r-card);padding:20px 16px;box-shadow:var(--shadow)}
#modalBox .m-actions{margin-top:16px;display:flex;flex-direction:column;gap:8px}
#toastBox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:60;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:var(--r-pill);font-size:13px;max-width:86vw;text-align:center}
.btn-primary.saved{background:var(--green)}
.bannercard{background:var(--card);border-radius:var(--r-card);padding:12px 16px;box-shadow:var(--shadow);margin-bottom:12px;font-size:13px;color:var(--orange);line-height:1.7}
</style>
</head>
<body>
<noscript>本应用需要启用 JavaScript。</noscript>

<!-- ============ S0 解锁页：山形SVG+标题+密钥+主按钮+离线只读文字链 ============ -->
<div id="gate">
  <div class="gate-box">
    <svg class="gate-logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="mtg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#007AFF"/><stop offset="1" stop-color="#30B0C7"/>
      </linearGradient></defs>
      <path d="M6 50 L24 26 L34 38 L42 28 L58 50 Z" fill="url(#mtg)"/>
      <path d="M14 22 L22 12 L28 19" fill="none" stroke="url(#mtg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

const U = {
  pad(n) { return n < 10 ? '0' + n : '' + n; },
  todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()); },
  addDays(str, n) { const p = str.split('-').map(Number); return U.todayStr(new Date(p[0], p[1] - 1, p[2] + n)); },
  diffDays(a, b) { const p1 = a.split('-').map(Number), p2 = b.split('-').map(Number); return Math.round((new Date(p2[0], p2[1] - 1, p2[2]) - new Date(p1[0], p1[1] - 1, p1[2])) / 86400000); },
  weekStart(str) { const p = str.split('-').map(Number); const d = new Date(p[0], p[1] - 1, p[2]); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return U.todayStr(d); },
  fmtShort(str) { const p = str.split('-'); return (+p[1]) + '/' + (+p[2]); },
  fmtTime(ts) { const d = new Date(ts); return U.pad(d.getHours()) + ':' + U.pad(d.getMinutes()); },
  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  num(v) { const n = parseFloat(v); return isNaN(n) ? null : n; },
  debounce(fn, ms) { let t = 0; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; },
  b64FromBytes(bytes) { let s = ''; const CH = 0x8000; for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(s); },
  bytesFromB64(b64) { const bin = atob(String(b64).replace(/\s+/g, '')); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; },
  utf8ToB64(str) { return U.b64FromBytes(new TextEncoder().encode(str)); },
  b64ToUtf8(b64) { return new TextDecoder().decode(U.bytesFromB64(b64)); }
};

/* ============ IndexedDB 离线缓存层 ============ */
const DB = {
  _db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('tineng', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
      r.onsuccess = () => { DB._db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  load() {
    return new Promise((res, rej) => {
      const t = DB._db.transaction('kv', 'readonly').objectStore('kv').get('data');
      t.onsuccess = () => res(t.result || null);
      t.onerror = () => rej(t.error);
    });
  },
  save(obj) {
    return new Promise((res, rej) => {
      const t = DB._db.transaction('kv', 'readwrite').objectStore('kv').put(obj, 'data');
      t.onsuccess = () => res();
      t.onerror = () => rej(t.error);
    });
  }
};

/* ============ Token 解密（第八部分，参数逐位一致） ============ */
async function decryptToken(pass, text) {
  const t = String(text).trim();
  if (t.indexOf('v1:') !== 0) throw new Error('bad-prefix');
  const raw = U.bytesFromB64(t.slice(3));
  if (raw.length <= CONFIG.SALT_BYTES + CONFIG.IV_BYTES) throw new Error('bad-length');
  const salt = raw.slice(0, CONFIG.SALT_BYTES);
  const iv = raw.slice(CONFIG.SALT_BYTES, CONFIG.SALT_BYTES + CONFIG.IV_BYTES);
  const ct = raw.slice(CONFIG.SALT_BYTES + CONFIG.IV_BYTES);
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: CONFIG.PBKDF2_ITERATIONS },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
  return new TextDecoder().decode(pt);
}

/* ============ GitHub 云端同步（第八部分） ============ */
function ghUrl() {
  return 'https://api.github.com/repos/' + CONFIG.GITHUB_USER + '/' + CONFIG.DATA_REPO + '/contents/' + CONFIG.DATA_PATH;
}
function ghHeaders(extra) {
  const h = { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json' };
  if (extra) for (const k in extra) h[k] = extra[k];
  return h;
}
async function ghGet() {
  const res = await fetch(ghUrl(), { headers: ghHeaders(), cache: 'no-store' });
  if (res.status === 404) return { status: 404, sha: null, remote: null };
  if (!res.ok) return { status: res.status, sha: null, remote: null };
  const json = await res.json();
  let remote = null;
  if (json && json.content) remote = JSON.parse(U.b64ToUtf8(json.content));
  return { status: 200, sha: json.sha || null, remote: remote };
}
async function ghPut(payload, sha) {
  const body = { message: 'update ' + new Date().toISOString(), content: U.utf8ToB64(JSON.stringify(payload)) };
  if (sha) body.sha = sha;
  return fetch(ghUrl(), { method: 'PUT', headers: ghHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
}
function contentFingerprint(o) {
  const c = JSON.parse(JSON.stringify(o));
  delete c.updatedAt;
  if (c.state) { delete c.state.lastSyncAt; delete c.state.pendingSync; }
  return JSON.stringify(c);
}
function pickNewer(a, b) {
  const am = (a && (a.updatedAt || a._mtime)) || 0;
  const bm = (b && (b.updatedAt || b._mtime)) || 0;
  return bm > am ? b : a;
}
function mergeByKey(aArr, bArr, key) {
  const map = {};
  (aArr || []).forEach((r) => { if (r && r[key] != null) map[r[key]] = r; });
  (bArr || []).forEach((r) => {
    if (!r || r[key] == null) return;
    if (!map[r[key]]) map[r[key]] = r; else map[r[key]] = pickNewer(map[r[key]], r);
  });
  return Object.keys(map).sort().map((k) => map[k]);
}
function mergeData(local, remote) {
  const out = defaultData();
  out.profile = pickNewer(local.profile, remote.profile);
  const st = Object.assign({}, pickNewer(local.state, remote.state));
  st.lastSyncAt = Math.max(local.state.lastSyncAt || 0, remote.state.lastSyncAt || 0);
  st.pendingSync = !!(local.state.pendingSync || remote.state.pendingSync);
  out.state = st;
  out.state.strengthReps = out.state.strengthReps || {};
  CONFIG.actions.forEach((a) => { if (out.state.strengthReps[a.repsKey] == null) out.state.strengthReps[a.repsKey] = 10; }); // Codex 复核 P1-1 修复：合并后补缺键，防 undefined/NaN 污染
  // 最终版增量键缺键防线（与 4f52b7f 同套路）：老远端备份无这些键时补默认
  ['preTrip', 'tour7', 'weekRev', 'weather', 'aiCfg', 'schedShift', 'girth', 'returnMark', 'rehab', 'graduated'].forEach((k) => { if (out.state[k] === undefined) out.state[k] = null; }); // aiCfg=问答外挂供应商配置（不含 key，key 只在本机 localStorage）；schedShift=FR-B1 顺延状态
  out.daily = mergeByKey(local.daily, remote.daily, 'date');
  out.metrics = mergeByKey(local.metrics, remote.metrics, 'date');
  out.tests = mergeByKey(local.tests, remote.tests, 'date');
  out.external = mergeByKey(local.external, remote.external, 'date');
  out.weekly = mergeByKey(local.weekly, remote.weekly, 'weekStart');
  out.updatedAt = new Date().toISOString();
  return out;
}
function handle401() {
  try { sessionStorage.removeItem('tineng_key'); } catch (e) {}
  TOKEN = null;
  showModal('<div class="card-title" style="margin-bottom:10px">同步失败</div>'
    + '<div class="body-tx">' + U.esc(CONFIG.copy.tokenExpired) + '</div>'
    + '<div class="m-actions"><button class="btn-primary" onclick="closeModal()">知道了</button></div>');
}
function syncFail(msg) {
  D.state.pendingSync = true;
  D.state.updatedAt = Date.now();
  DB.save(D).catch(() => {});
  updateSyncBadge();
  if (msg) toast(msg);
}
async function pushNow() {
  if (readOnly) return;
  if (!TOKEN) { D.state.pendingSync = true; updateSyncBadge(); return; }
  try {
    let payload = Object.assign({}, D, { updatedAt: new Date().toISOString() });
    let res = await ghPut(payload, ghSha);
    if (res.status === 409 || res.status === 422) {
      const g = await ghGet();
      if (g.status === 200 && g.remote) {
        D = mergeData(D, g.remote);
        await DB.save(D);
        ghSha = g.sha;
        payload = Object.assign({}, D, { updatedAt: new Date().toISOString() });
        res = await ghPut(payload, ghSha);
      } else if (g.status === 404) {
        ghSha = null;
        payload = Object.assign({}, D, { updatedAt: new Date().toISOString() });
        res = await ghPut(payload, null);
      }
    }
    if (res.ok) {
      const j = await res.json();
      if (j && j.content && j.content.sha) ghSha = j.content.sha;
      D.state.lastSyncAt = Date.now();
      D.state.pendingSync = false;
      D.state.updatedAt = Date.now();
      await DB.save(D);
      updateSyncBadge();
    } else if (res.status === 401 || res.status === 403) {
      handle401(); syncFail(null);
    } else {
      syncFail('同步失败，数据已缓存在本机，联网后自动重试');
    }
  } catch (e) {
    syncFail('同步失败，数据已缓存在本机，联网后自动重试');
  }
}
function updateSyncBadge() {
  const el = document.getElementById('syncBadge');
  if (!el || !D) return;
  if (readOnly) { el.textContent = '离线只读'; el.className = ''; return; }
  const last = D.state.lastSyncAt || 0;
  if (D.state.pendingSync) { el.textContent = '待同步'; el.className = 'pending'; return; }
  if (!last) { el.textContent = '未同步'; el.className = ''; return; }
  const days = Math.floor((Date.now() - last) / 86400000);
  if (days > CONFIG.syncStaleDays) { el.textContent = '距上次同步' + days + '天'; el.className = 'stale'; }
  else { el.textContent = '云端已同步 ' + U.fmtTime(last); el.className = ''; }
}

/* ============ S0 解锁 / S3 换机恢复 ============ */
function gateMsg(s) { document.getElementById('gateMsg').textContent = s; }
async function tryUnlock() {
  if (!D) D = defaultData(); // 兜底：无论 init 是否完成，解锁路径都保证有数据对象
  const pass = document.getElementById('gateKey').value;
  if (!pass) { gateMsg('请输入密钥'); return; }
  const btn = document.getElementById('btnUnlock');
  btn.disabled = true;
  gateMsg('正在获取加密配置…');
  let text = gistTextCache;
  try {
    const r = await fetch(CONFIG.GIST_RAW_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('GIST_HTTP_' + r.status);
    text = await r.text();
    gistTextCache = text;
  } catch (e) {
    if (gistTextCache) { // 批5实测修复①：网络不可达但本会话已有密文缓存 → 直接用缓存解密（只是读取源降级，不碰加密协议）
      gateMsg('网络不可达，使用本次会话已缓存的加密配置…');
      text = gistTextCache;
    } else {
      btn.disabled = false;
      const m = String(e.message || '');
      if (m !== 'GIST_HTTP_404' && !localEmpty()) { // 批5实测修复②：断网+本机有缓存数据 → 自动进离线模式（验收五条第5条：山上断网照样打开）
        enterOffline();
        toast('断网且解锁配置不可达：已进入离线模式（本机缓存，数据可能不是最新），联网后重新解锁即可恢复同步。');
        return;
      }
      if (m === 'GIST_HTTP_404') { // v4.1 实测修复：404=云端还没数据（新设备/首次使用）——给新建出口，不再死路
        gateMsg('');
        document.getElementById('gateMsg').innerHTML = '云端还没有你的数据仓（HTTP 404）——第一次使用？<button class="btn-mini" style="margin:4px 0" onclick="startFresh()">以此密钥开始新数据</button><div class="sub">已有数据的老用户：检查密钥拼写，或先用下方离线只读模式。</div>';
        btn.disabled = false;
        return;
      }
      gateMsg('无法获取加密配置：网络不可达或超时。可先用下方离线只读模式。');
      return;
    }
  }
  gateMsg('正在解密…');
  let token = '';
  try { token = await decryptToken(pass, text); }
  catch (e) { btn.disabled = false; gateMsg('密钥错误或数据损坏，可重试'); return; }
  TOKEN = token; // 仅内存
  try { sessionStorage.setItem('tineng_key', pass); } catch (e) {} // 密钥仅 sessionStorage
  if (pass.length < 12) toast('已解锁。提示：密钥不足 12 位，建议更换更强口令（口令是唯一防线，密文在公开 Gist 可被离线爆破）'); // Codex 复核 P1-4：不强锁已用口令（防自锁），只提示
  try { if (!localStorage.getItem('tineng_pwaHint')) { localStorage.setItem('tineng_pwaHint', '1'); setTimeout(() => toast('建议加到主屏幕：Safari 分享 → 添加到主屏幕（通知/启动/离线体验都靠它）'), 2500); } } catch (e) {}
  enterApp();
}
function startFresh() { // v4.1 实测修复：404 时以当前密钥新建空数据进入（老设备数据仍在旧机，联网解锁后 mergeData 合并不冲突）
  const pass = document.getElementById('gateKey').value;
  D = defaultData();
  TOKEN = '';
  try { sessionStorage.setItem('tineng_key', pass); } catch (e) {}
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  nav('pgToday');
  toast('新数据已就绪：晨检、记录从今天开始积累');
}
function enterOffline() {
  if (!D) D = defaultData(); // 兜底
  // 批9走查修复（重大）：离线模式放开本地写入——山上断网必须能晨检能记录（验收五条第5条）。
  // 本地 IndexedDB 写入不依赖网络；未同步数据带 updatedAt，联网解锁后 mergeData 自动合并，不会覆盖云端。
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  nav('pgToday');
  toast('离线模式：可以正常晨检和记录，改动先存本机，联网解锁后自动同步');
}
function localEmpty() { return ['daily', 'metrics', 'weekly', 'tests', 'external'].every((k) => !D[k].length); }
function recCount(o) { return ['daily', 'metrics', 'weekly', 'tests', 'external'].reduce((s, k) => s + ((o[k] && o[k].length) || 0), 0); }

async function enterApp() {
  readOnly = false;
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  nav('pgToday');
  const wasEmpty = localEmpty();
  try {
    const g = await ghGet();
    if (g.status === 200) {
      if (wasEmpty && g.remote && recCount(g.remote) > 0) { ghSha = g.sha; askRestore(g.remote); return; }
      ghSha = g.sha;
      if (g.remote) {
        const fpRemote = contentFingerprint(g.remote);
        D = mergeData(D, g.remote);
        await DB.save(D);
        if (contentFingerprint(Object.assign({}, D, { updatedAt: null })) !== fpRemote) persist();
        else {
          D.state.lastSyncAt = Date.now();
          D.state.pendingSync = false;
          D.state.updatedAt = Date.now();
          await DB.save(D);
        }
      }
    } else if (g.status === 404) {
      ghSha = null; // 首次写入：不带 sha 创建
    } else if (g.status === 401 || g.status === 403) {
      handle401();
    } else {
      toast('云端读取失败（HTTP ' + g.status + '），当前使用本机数据');
    }
  } catch (e) {
    toast('云端读取失败，当前使用本机数据');
  }
  afterEnter();
}
function askRestore(remote) {
  const n = recCount(remote);
  const when = remote.updatedAt ? String(remote.updatedAt).replace('T', ' ').slice(0, 16) : '未知时间';
  showModal('<div class="card-title" style="margin-bottom:10px">检测到云端数据</div>'
    + '<div class="body-tx">检测到云端数据（' + n + ' 条记录，最后更新 ' + U.esc(when) + '），是否恢复到本设备？</div>'
    + '<div class="m-actions">'
    + '<button class="btn-primary" id="mRestore">恢复到本设备</button>'
    + '<button class="btn-ghost" id="mSkipRestore">暂不，使用本机</button></div>');
  document.getElementById('mRestore').onclick = async () => {
    D = mergeData(D, remote);
    rebuildSched(); // Codex 复核 P1-3 修复：云端恢复后立即重建课表生效缓存
    await DB.save(D);
    closeModal();
    toast('已恢复云端数据');
    afterEnter();
  };
  document.getElementById('mSkipRestore').onclick = () => {
    ghSha = null; // 不缓存 sha：下次保存走"冲突→GET→合并"，避免覆盖云端
    closeModal();
    afterEnter();
  };
}
function afterEnter() {
  updateSyncBadge();

}

/* ============ S2 历史回填 ============ */
function openBackfill() { document.getElementById('backfill').hidden = false; }
function closeBackfill() { document.getElementById('backfill').hidden = true; }
function saveBackfill() {
  if (readOnly) { toast('离线只读模式，不能写入'); return; }
  const sl = U.num(document.getElementById('bfSleep').value);
  const rh = U.num(document.getElementById('bfRhr').value);
  const hv = U.num(document.getElementById('bfHrv').value);
  if (sl == null && rh == null && hv == null) { toast('请至少填写一项'); return; }
  const t = U.todayStr();
  let made = 0;
  for (let i = 6; i >= 0; i--) {
    const d = U.addDays(t, -i);
    if (D.metrics.some((x) => x.date === d)) continue; // 已有记录的日期不覆盖
    D.metrics.push(recStamp({ date: d, sleepH: sl, rhr: rh, hrv: hv }));
    made++;
  }
  D.metrics.sort((a, b) => (a.date < b.date ? -1 : 1));
  let baseMsg = '';
  if (rh != null && made > 0) {
    D.profile.rhrBaseline = rh; // 回填RHR≥4天 → 重算基线=回填均值（覆盖预填60）
    D.profile.updatedAt = Date.now();
    baseMsg = '，静息心率基线已重算为 ' + rh;
  }
  D.state.backfillDone = true;
  D.state.updatedAt = Date.now();
  persist();
  closeBackfill();
  updateSyncBadge();
  renderToday();
  toast('已生成 ' + made + ' 天历史记录' + baseMsg);
}
function skipBackfill() {
  D.state.backfillDone = true;
  D.state.updatedAt = Date.now();
  persist();
  closeBackfill();
}

/* ============ 指标层 M（UI 只调用，不自行计算） ============ */
const M = {
  age() { // 周岁，由生日实时计算
    const b = D.profile.birthday;
    if (!b) return null;
    const p = b.split('-').map(Number);
    const t = new Date();
    let a = t.getFullYear() - p[0];
    const m = t.getMonth() + 1 - p[1];
    if (m < 0 || (m === 0 && t.getDate() < p[2])) a--;
    return a;
  },
  hrHardCap() { const a = M.age(); return a == null ? null : CONFIG.hrCapBase - a; }, // 估算值
  recOn(arr, date) { return arr.find((x) => x.date === date) || null; },
  dailyOn(date) { return M.recOn(D.daily, date); },
  metricOn(date) { return M.recOn(D.metrics, date); },
  latestDaily() { return D.daily.length ? D.daily[D.daily.length - 1] : null; },
  latestTest() { return D.tests.length ? D.tests[D.tests.length - 1] : null; },
  rhrBaseline() { // 三级优先：手动(自动校准关) > 近7天均值(≥4天) > 预填60
    if (!D.state.autoCalibrateRHR) return D.profile.rhrBaseline;
    const days = [];
    for (let i = 0; i < CONFIG.rhrBaseWindow; i++) {
      const m = M.metricOn(U.addDays(U.todayStr(), -i));
      if (m && m.rhr != null) days.push(m.rhr);
    }
    if (days.length >= CONFIG.rhrBaseMinDays) return Math.round(days.reduce((s, x) => s + x, 0) / days.length);
    return D.profile.rhrBaseline;
  },
  hrvBaseline() { // v3.3：HRV 滚动基线，口径与 rhrBaseline 一致（近7天均值≥4天 > 档案预填50）
    if (!D.state.autoCalibrateRHR) return D.profile.hrvBaseline;
    const days = [];
    for (let i = 0; i < CONFIG.rhrBaseWindow; i++) {
      const m = M.metricOn(U.addDays(U.todayStr(), -i));
      if (m && m.hrv != null) days.push(m.hrv);
    }
    if (days.length >= CONFIG.rhrBaseMinDays) return Math.round(days.reduce((s, x) => s + x, 0) / days.length);
    return D.profile.hrvBaseline;
  },
  weekChecked(ws) { // 休息日与病假均计为已打卡
    let n = 0;
    for (let i = 0; i < 7; i++) if (M.dailyOn(U.addDays(ws, i))) n++;
    return n;
  },
  weekCompletion(ws) { return M.weekChecked(ws) / (D.profile.weeklyDays || 6); },
  weekLoad(ws) { // 周负荷 = Σ(时长×RPE)
    let s = 0;
    D.daily.forEach((r) => {
      if (r.date >= ws && r.date < U.addDays(ws, 7) && CONFIG.trainTypes.indexOf(r.type) >= 0 && r.durationMin && r.rpe) s += r.durationMin * r.rpe;
    });
    return s;
  },
  weekLowInt(ws) { // 周低强度 = 有氧 + 长时活动
    let s = 0;
    D.daily.forEach((r) => {
      if (r.date >= ws && r.date < U.addDays(ws, 7) && (r.type === '有氧' || r.type === '长时活动') && r.durationMin) s += r.durationMin;
    });
    return s;
  },
  weekHasTrain(ws) { return D.daily.some((r) => r.date >= ws && r.date < U.addDays(ws, 7) && CONFIG.trainTypes.indexOf(r.type) >= 0); },
  footWeekDays(ws) { let n = 0; for (let i = 0; i < 7; i++) { const r = M.dailyOn(U.addDays(ws, i)); if (r && r.footRehab) n++; } return n; },
  footTotalDays() { return D.daily.filter((r) => r.footRehab).length; },
  sleep7Days() { let n = 0; for (let i = 0; i < 7; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.sleepH != null && m.sleepH >= CONFIG.sleepRefH) n++; } return n; },
  sleepTotalDays() { return D.metrics.filter((m) => m.sleepH != null && m.sleepH >= CONFIG.sleepRefH).length; },
  sleepAvg7() { let s = 0, n = 0; for (let i = 0; i < 7; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.sleepH != null) { s += m.sleepH; n++; } } return n ? (s / n) : null; },
  rhrAvg7() { let s = 0, n = 0; for (let i = 0; i < 7; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.rhr != null) { s += m.rhr; n++; } } return n ? Math.round(s / n) : null; },
  hrvAvg7() { let s = 0, n = 0; for (let i = 0; i < 7; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.hrv != null) { s += m.hrv; n++; } } return n ? Math.round(s / n) : null; },
  load7() { let s = 0; for (let i = 0; i < 7; i++) { const r = M.dailyOn(U.addDays(U.todayStr(), -i)); if (r && CONFIG.trainTypes.indexOf(r.type) >= 0 && r.durationMin && r.rpe) s += r.durationMin * r.rpe; } return s; },
  sleepStats(days) { let w = 0, g = 0; for (let i = 0; i < days; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.sleepH != null) { w++; if (m.sleepH >= CONFIG.sleepRefH) g++; } } return { withData: w, ge7: g }; },
  rhrOverDays(days) { let n = 0; const b = M.rhrBaseline(); for (let i = 0; i < days; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.rhr != null && m.rhr > b + CONFIG.rhrYelDelta) n++; } return n; },
  rhrDataDays(days) { let n = 0; for (let i = 0; i < days; i++) { const m = M.metricOn(U.addDays(U.todayStr(), -i)); if (m && m.rhr != null) n++; } return n; },
  paceStats() {
    let withHr = 0, ok = 0;
    const from = U.addDays(U.todayStr(), -27);
    D.daily.forEach((r) => {
      if (r.date >= from && (r.type === '有氧' || r.type === '长时活动') && r.avgHr != null) { withHr++; if (r.avgHr <= CONFIG.zone2Cap) ok++; }
    });
    return { withHr: withHr, pct: withHr ? Math.round(ok / withHr * 100) : null };
  },
  weekWeightDrop() {
    if (!D.weekly || D.weekly.length < 2) return null;
    const ws = D.weekly.slice().sort((a, b) => (a.weekStart < b.weekStart ? -1 : 1));
    const a = ws[ws.length - 2].weightKg, b = ws[ws.length - 1].weightKg;
    if (a == null || b == null) return null;
    return { drop: a - b, prev: a, cur: b };
  },
  redInDays(n) { let c = 0; for (let i = 0; i < n; i++) if (R.lightOn(U.addDays(U.todayStr(), -i)).level === 'red') c++; return c; },
  weeksCompletionOk() {
    const t = U.todayStr();
    for (let i = 0; i < CONFIG.phaseWeeks; i++) if (M.weekCompletion(U.addDays(U.weekStart(t), -7 * i)) < CONFIG.phaseDonePct) return false;
    return true;
  },
  zone2LongCount() { // 估算值：有心率且≤zone2Cap 的≥60分钟单次
    let c = 0;
    D.daily.forEach((r) => {
      if ((r.type === '有氧' || r.type === '长时活动') && r.durationMin >= CONFIG.z2LongMin && r.avgHr != null && r.avgHr <= CONFIG.zone2Cap) c++;
    });
    return c;
  },
  longSessionOk() { // 估算值：≥3h 且 RPE≤5，次日 RHR 回基线±5
    for (let i = 0; i < D.daily.length; i++) {
      const r = D.daily[i];
      if (r.type === '长时活动' && r.durationMin >= CONFIG.longMin && r.rpe != null && r.rpe <= CONFIG.longRpeMax) {
        const m = M.metricOn(U.addDays(r.date, 1));
        if (m && m.rhr != null && Math.abs(m.rhr - M.rhrBaseline()) <= CONFIG.rhrNextDayDelta) return true;
      }
    }
    return false;
  },
  footStandInfo() { // 足部前置：体测闭眼单腿每侧≥20s（估算值）
    const t = M.latestTest();
    if (!t || t.standL == null || t.standR == null) return { ok: false, why: '需先完成家庭体测（闭眼单腿站立）' };
    const ok = t.standL >= CONFIG.ankleFrontStand && t.standR >= CONFIG.ankleFrontStand;
    return { ok: ok, why: ok ? '' : '闭眼单腿需每侧≥' + CONFIG.ankleFrontStand + 's（当前 左' + t.standL + 's/右' + t.standR + 's）' };
  },
  isFootAnklePain(p) { return p && p !== '无' && (String(p).indexOf('足') >= 0 || String(p).indexOf('踝') >= 0); },
  footPainFreeDays() { // 连续无足/踝痛打卡天数（自有记录起，最多回看60天）
    let n = 0;
    const cap = D.daily.length ? Math.min(60, U.diffDays(D.daily[0].date, U.todayStr()) + 1) : 0;
    for (let i = 0; i < cap; i++) {
      const r = M.dailyOn(U.addDays(U.todayStr(), -i));
      if (r && M.isFootAnklePain(r.pain)) break;
      n++;
    }
    return n;
  },
  footPainStreak() { // 连续足/踝痛打卡天数
    let n = 0;
    for (let i = 0; i < 30; i++) {
      const r = M.dailyOn(U.addDays(U.todayStr(), -i));
      if (r && M.isFootAnklePain(r.pain)) n++; else break;
    }
    return n;
  }
};

/* ============ 规则层 R（第七部分：灯态 / 足踝细分 / 阶段状态机） ============ */
const R = {
  lightOn(date) {
    const rec = M.dailyOn(date);
    // 灯态第一步：疼痛三分支（足=黄减负 / 踝=黄降级 / 膝腰其他=红）；ev=决策依据（B-2 透明化）
    if (rec && rec.pain && rec.pain !== '无') {
      const p = String(rec.pain);
      if (p.indexOf('踝') >= 0) return { level: 'yellow', reason: CONFIG.copy.yellowAnkle, ev: ['踝痛打卡 ⚠'] };
      if (p.indexOf('足') >= 0) return { level: 'yellow', reason: CONFIG.copy.yellowFoot, ev: ['足痛打卡 ⚠'] };
      return { level: 'red', reason: CONFIG.copy.red, ev: [p + '疼痛打卡 ⚠'] };
    }
    const base = M.rhrBaseline();
    let rhrRed = true, rhrYel = true;
    for (let i = 0; i < CONFIG.rhrRedDays; i++) {
      const m = M.metricOn(U.addDays(date, -i));
      if (!(m && m.rhr != null && m.rhr > base + CONFIG.rhrRedDelta)) rhrRed = false;
      if (!(m && m.rhr != null && m.rhr > base + CONFIG.rhrYelDelta)) rhrYel = false;
    }
    if (rhrRed && rec && rec.mood === '差') return { level: 'red', reason: '静息心率连续' + CONFIG.rhrRedDays + '天超基线+' + CONFIG.rhrRedDelta + ' 且主观状态差', ev: ['静息心率连续' + CONFIG.rhrRedDays + '天超基线+' + CONFIG.rhrRedDelta, '主观状态差'] };
    let sleepBad = true;
    for (let i = 0; i < CONFIG.sleepShortDays; i++) {
      const m = M.metricOn(U.addDays(date, -i));
      if (!(m && m.sleepH != null && m.sleepH < CONFIG.sleepShortH)) sleepBad = false;
    }
    if (sleepBad) return { level: 'yellow', reason: CONFIG.copy.yellowSleep, ev: ['睡眠<' + CONFIG.sleepShortH + 'h 连续' + CONFIG.sleepShortDays + '天 ⚠'] };
    if (rhrYel) return { level: 'yellow', reason: '静息心率连续' + CONFIG.rhrYelDays + '天超基线+' + CONFIG.rhrYelDelta, ev: ['静息心率连续' + CONFIG.rhrYelDays + '天超基线+' + CONFIG.rhrYelDelta] };
    let moodBad = true;
    for (let i = 0; i < CONFIG.moodBadDays; i++) {
      const r = M.dailyOn(U.addDays(date, -i));
      if (!(r && r.mood === '差')) moodBad = false;
    }
    if (moodBad) return { level: 'yellow', reason: '主观状态连续' + CONFIG.moodBadDays + '天为"差"', ev: ['主观状态连续' + CONFIG.moodBadDays + '天为"差"'] };
    // 绿灯：把通过的正向依据列出来（数据没填的如实标注"未记录"，不冒充✓）
    const m0 = M.metricOn(date);
    const ev = [];
    if (m0 && m0.sleepH != null) ev.push(m0.sleepH < CONFIG.sleepShortH ? '睡眠 ' + m0.sleepH + 'h（连续' + CONFIG.sleepShortDays + '天不足才黄灯）' : '睡眠✓');
    else ev.push('睡眠未记录');
    if (m0 && m0.rhr != null) ev.push(m0.rhr > base + CONFIG.rhrYelDelta ? '静息心率 ' + m0.rhr + '（连续' + CONFIG.rhrYelDays + '天超基线才黄灯）' : 'RHR✓');
    else ev.push('RHR未记录');
    ev.push('无疼痛✓', '足康复 Stage ' + D.state.footStage + ' 进行中');
    return { level: 'green', reason: CONFIG.copy.green, ev: ev };
  },
  todayLight() { // 疼痛取最近一条记录（最新已知状态）
    const latest = M.latestDaily();
    if (latest && latest.pain && latest.pain !== '无') {
      const p = String(latest.pain);
      if (p.indexOf('踝') >= 0) return { level: 'yellow', reason: CONFIG.copy.yellowAnkle, ev: ['踝痛打卡 ⚠'] };
      if (p.indexOf('足') >= 0) return { level: 'yellow', reason: CONFIG.copy.yellowFoot, ev: ['足痛打卡 ⚠'] };
      return { level: 'red', reason: CONFIG.copy.red, ev: [p + '疼痛打卡 ⚠'] };
    }
    return R.lightOn(U.todayStr());
  },
  advice(L) {
    if (L.level === 'red') return '停训，仅八段锦/足底放松';
    if (L.level === 'yellow') return '减量30-50%，仅低强度';
    const day = effTemplate()[new Date().getDay()];
    return '今日按排表：' + day + '。' + CONFIG.copy.phase[D.state.phase];
  },
  /* 踝痛打卡：黄灯 + footStage 自动-1（0不再降），每条记录只处理一次 */
  applyAnklePain(rec) {
    if (rec.painProcessed) return false;
    if (!(rec.pain && String(rec.pain).indexOf('踝') >= 0)) return false;
    rec.painProcessed = true;
    const before = D.state.footStage;
    D.state.footStage = Math.max(0, before - 1);
    D.state.updatedAt = Date.now();
    return true;
  },
  footFrontOk() { // 阶段1→2 足部前置：连续14天无足/踝痛 + 体测单腿每侧≥20s
    return M.footPainFreeDays() >= CONFIG.anklePainFreeDaysSafe() && M.footStandInfo().ok;
  },
  evalPhase() {
    const s = D.state;
    const t = U.todayStr();
    if (s.downgradedAt) {
      if (U.diffDays(s.downgradedAt, t) >= CONFIG.downHoldDays) { s.downgradedAt = null; }
      else return;
    }
    let allYellow = true, hasRed = false;
    for (let i = 0; i < CONFIG.yellowDownRun; i++) {
      const lv = R.lightOn(U.addDays(t, -i)).level;
      if (lv === 'red') hasRed = true;
      if (lv !== 'yellow') allYellow = false;
    }
    if (allYellow || hasRed) {
      if (s.phase > 0) {
        s.phase--; // 降级：降1级 + 维持7天再评估（阶段为整数）
        s.downgradedAt = t;
        s.updatedAt = Date.now();
        toast('已触发降级：阶段→' + s.phase + '，维持' + CONFIG.downHoldDays + '天');
      }
      return;
    }
    if (s.phase === 0) {
      if (M.redInDays(CONFIG.noRedDays) === 0 && M.weeksCompletionOk()) { s.phase = 1; s.updatedAt = Date.now(); showPhaseUp(1); }
    } else if (s.phase === 1) {
      if (M.zone2LongCount() >= CONFIG.z2LongCount && R.footFrontOk()) { s.phase = 2; s.updatedAt = Date.now(); showPhaseUp(2); }
    } else if (s.phase === 2) {
      if (M.longSessionOk()) { s.phase = 3; s.updatedAt = Date.now(); showPhaseUp(3); }
    }
  },
  nextRetest() { return D.state.lastTestDate ? U.addDays(D.state.lastTestDate, CONFIG.retestDays) : null; }
};
CONFIG.anklePainFreeDaysSafe = function () { return 14; }; // 足部前置：连续14天无足/踝痛（估算值）

/* ============ Tab1 今天 ============ */
const tf = { type: '无', cardioChoice: null, checks: CONFIG.actions.map(() => false), painOpt: '无', painText: '', mood: '', footRehab: false, baduanjin: false };

function streakCells(kind) {
  const onCls = kind === 'footRehab' ? 'o-on' : 'p-on';
  let s = '<div class="streak">';
  for (let i = 4; i >= 0; i--) {
    const d = U.addDays(U.todayStr(), -i);
    const r = M.dailyOn(d);
    let c = '';
    if (i === 0 && (kind === 'footRehab' ? tf.footRehab : tf.baduanjin)) c = onCls;
    else if (r && r[kind]) c = onCls;
    else if (r && (r.type === '休息日' || r.type === '病假')) c = 'rest';
    s += '<i class="' + c + (i === 0 ? ' today' : '') + '"></i>';

  return s + '</div>';
}

function heatHint() { // FR-D 气温提示（v4.1）：>32℃ 长走提前清晨/<5℃ 热身延长；数据源=今晨实况 appMax（手选天气无实测温不提示）

    + '<div class="sub"><label><input type="checkbox" id="grNext"> 次日无异常</label></div>'
    + '<div class="sub" style="margin-top:6px">判定依据：内部经验值 57s/100 分（§12.2 Q6 专项期前补真人专业复核）。</div>'
    + '<div class="m-actions">'

function sleepDebtLine() { // 睡眠保持一行（v4.1 口径改名，原措辞作废）：近 7 天均值 vs 6.5h 底线（K9 口径）；样本 <3 天不硬算（数据不足明说）
  const days = [];

  if (gap <= 0) return '<div class="sub" style="color:var(--green)">睡眠保持：近 ' + days.length + ' 天均 ' + avg.toFixed(1) + 'h，守住 6.5h 底线——这是本周最值钱的资产。</div>';

}
function sleepCardHtml() {

/* ============ 状态建议卡（v3.3 核心：按身体状态给今天档位） ============ */
/* 判定口径（有出处，勿拍脑改）：
   - 档位规则 = 体能系统 v3.3 优化清单 1.4 拍板：睡眠 6.5/5h 绝对线；RHR 相对基线 +3/+7/+10；HRV 低于基线 10%；脚疼即降；连续 2 天降档 → 完全休息
   - 睡眠线证据（开工单单元2 落地①）= Nedeltcheva 2010（Ann Intern Med 153(7):435-441，PMID 20921542，（检索级核对））：10 人/14 天热量限制交叉试验，睡 5.5h 组瘦体重丢失 2.4kg vs 睡足组 1.5kg（多丢 60%）、脂肪少丢 55%——语境=减脂期非增肌、样本小，只作方向性依据；人话层在 K9
   - 基线偏差法 = 运动科学常规（个人基线滚动对比，同 AI Endurance 30 天基线思路；夜间 HRV/RHR 优于日间，Kubios 口径）
   - 权重参照 = Vitalstat 公开恢复分方案（睡眠 40%/HRV 25%/静息心率 10%）：本卡按清单用序贯判定，不折算总分
   - 疼痛分诊 = 知识包分诊红线卡（K14）：红灯词命中 → 停训就医；膝/腰疼痛 → 停训（与 K7 灯色规则同口径） */
function readinessEval(dateStr) { // 返回 {level:'ok'|'down'|'floor', reasons:[]}：dateStr 当天的练量档位，看它前一天的身体信号
  const m = M.metricOn(U.addDays(dateStr, -1));
  const d = M.dailyOn(U.addDays(dateStr, -1));
  const reasons = [];
  let floor = false, down = false;
  if (m && m.sleepH != null) { // 睡眠（清单绝对线）
    if (m.sleepH < 5) { floor = true; reasons.push('睡眠 ' + m.sleepH + 'h（<5h）'); }
    else if (m.sleepH < 6.5) { down = true; reasons.push('睡眠 ' + m.sleepH + 'h（5-6.5h）'); }
  }
  if (m && m.rhr != null) { // 静息心率相对滚动基线
    const dev = m.rhr - M.rhrBaseline();
    if (dev > 10) { floor = true; reasons.push('静息心率超基线 +' + dev); }
    else if (dev > 3) { down = true; reasons.push('静息心率超基线 +' + dev); }
  }
  if (m && m.hrv != null && M.hrvBaseline() > 0) { // HRV 相对基线
    const devPct = Math.round((m.hrv - M.hrvBaseline()) / M.hrvBaseline() * 100);
    if (devPct <= -10) { down = true; reasons.push('HRV 低于基线 ' + devPct + '%'); }
  }
  const pain = d && d.pain && d.pain !== '无' ? d.pain : null; // 疼痛部位口径与 K7 灯色规则一致
  if (pain && (pain.indexOf('足') >= 0 || pain.indexOf('踝') >= 0)) { down = true; reasons.push('昨日足/踝疼痛（' + pain + '）'); }
  else if (pain) { floor = true; reasons.push('昨日' + pain + '疼痛'); }
  const fm = D.state.feelMark; // 主观点选（只作用于"今天"的判定；历史日评估不引入今天的感受，否则会误判连续降档）
  if (fm && fm.date === dateStr && fm.date === U.todayStr()) {
    if (fm.feel === '很虚') { floor = true; reasons.push('主观状态：很虚'); } // v3.5 四选：很虚→恢复课档（开工单§四）
    else if (fm.feel === '累') { down = true; reasons.push('主观状态：累'); }
  }
  return { level: floor ? 'floor' : (down ? 'down' : 'ok'), reasons: reasons };
}
function footRedCheck() { // 红灯筛查：近 2 天疼痛文本命中红线词 → 停训就医横幅（知识包分诊卡口径）
  const words = ['夜间痛', '夜间疼', '肿胀', '无法承重', '压痛', '畸形', '绞锁'];
  for (let i = 0; i < 2; i++) {
    const d = M.dailyOn(U.addDays(U.todayStr(), -i));
    if (!d || !d.pain || d.pain === '无') continue;
    const hit = words.filter((w) => (d.pain + (d.mobilityNote || '')).indexOf(w) >= 0);
    if (hit.length) return '<div class="sub" style="color:var(--red);font-weight:600">🚩 疼痛描述命中红线信号（' + hit.join('、') + '）：立即停训，就医评估——这不是训练强度问题。</div>';
  }
  return '';
}

function schedShiftWeeks() { // FR-B1 顺延读数：state.schedShift={weeks:0-2,log:[]} 可选键，钳位 0-2

function anchorDate() { // 周期起点函数（v4.1）：CYCLE_START + 顺延周数×7 天——全周期进度/复测点/倒计时唯一锚

function cycleWeekOf(dateStr) { // 返回 0（未开营）/1-36（冬训 1-24 + 专项 25-36）/37（已满）
  if (!dateStr) return 0;
  const s = Math.floor((new Date(dateStr).getTime() - new Date(anchorDate()).getTime()) / 86400000);
  return Math.max(0, Math.min(37, Math.floor(s / 7) + 1));
}

function parseHealthPaste(text) { // FR-A1：粘贴健康数据解析（宽容三格式：JSON/CSV/快捷指令逐行文本）→ {sleepH,rhr,hrv}，失败 throw {msg}
  const t = String(text || '').trim();
  if (!t) throw { msg: '先粘贴内容再解析' };
  const num = (x) => { const n = parseFloat(String(x).replace(/[^\d.]/g, '')); return isNaN(n) ? null : n; };
  if (t[0] === '{') {
    try {
      const o = JSON.parse(t);
      const r = { sleepH: num(o.sleepH != null ? o.sleepH : (o.sleep != null ? o.sleep : o['睡眠'])), rhr: num(o.rhr != null ? o.rhr : o['静息心率'] != null ? o['静息心率'] : o['心率']), hrv: num(o.hrv != null ? o.hrv : o.HRV) };
      if (r.sleepH == null && r.rhr == null && r.hrv == null) throw 0;
      return fin(r);
    } catch (e) { throw { msg: 'JSON 没认出来——键名要 sleepH/rhr/hrv 或 睡眠/静息心率/HRV' }; }
  }
  const lines = t.split(/\n+/).map((x) => x.trim()).filter(Boolean);
  if (lines.length === 1 && /[,.\t，]/.test(lines[0]) && !/[:：]/.test(lines[0])) { // 单行 CSV（可选中文逗号）
    const parts = lines[0].split(/[,，\t]/).map(num);
    if (parts.slice(0, 3).some((x) => x != null)) return fin({ sleepH: parts[0] != null ? parts[0] : null, rhr: parts[1] != null ? parts[1] : null, hrv: parts[2] != null ? parts[2] : null });
  }
  if (/sleepH/i.test(lines[0]) && lines.length >= 2 && /[,\t]/.test(lines[0])) { // 带表头 CSV
    const head = lines[0].split(/[,\t]/).map((x) => x.trim().toLowerCase());
    const val = (lines[1] || '').split(/[,\t]/);
    const pick = (names) => { const i = head.findIndex((h) => names.some((n) => h.indexOf(n) >= 0)); return i >= 0 ? num(val[i]) : null; };
    return fin({ sleepH: pick(['sleep']), rhr: pick(['rhr', 'resting', '心率']), hrv: pick(['hrv']) });
  }
  const out = { sleepH: null, rhr: null, hrv: null };
  const KM = [[/睡/, 'sleepH'], [/sleep/i, 'sleepH'], [/静息|resting|rhr/i, 'rhr'], [/^心率/, 'rhr'], [/hrv|变异/i, 'hrv']];
  lines.forEach((ln) => {
    const m = ln.match(/^([^:：\d]+)[:：\s]+(.+)$/);
    if (!m) return;
    const v = num(m[2]);
    if (v == null) return;
    for (const kv of KM) { if (kv[0].test(m[1].trim())) { if (out[kv[1]] == null) out[kv[1]] = v; break; } }
  });
  if (out.sleepH == null && out.rhr == null && out.hrv == null) throw { msg: '三种格式都没认出来——支持逐行"睡眠 7.5"、CSV、JSON，点下方示例看格式' };
  return fin(out);
  function fin(r) { // 睡眠单位宽容：>24 视为分钟换算成小时
    if (r.sleepH != null && r.sleepH > 24) r.sleepH = Math.round(r.sleepH / 60 * 10) / 10;
    return r;
  }
}

function setWeather(wx) { // 手动改天气：覆盖自动实况（manual 标记），当天有效
  tf.weather = wx;
  D.state.weather = { date: U.todayStr(), wx: wx, desc: '手动选择', manual: true, t: Date.now() };
  D.state.updatedAt = Date.now();

function wxFromCode(code, appMax, windKmh) { // WMO weather code → 产品天气档（wind 单位 km/h——open-meteo 实测确认，阈值 39≈6 级风）
  code = code == null ? 0 : code;
  if ([51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].indexOf(code) >= 0) return ['雨雪', code >= 95 ? '雷雨' : (code >= 71 ? '雪' : '降水')];
  if (windKmh != null && windKmh >= 39) return ['大风降温', '风速' + Math.round(windKmh) + 'km/h'];
  if (appMax != null && appMax >= 33) return ['闷热', '体感' + Math.round(appMax) + '°C'];
  return ['好天', code === 0 ? '晴' : (code <= 3 ? '多云' : '雾/霾')];
}
async function fetchWeather() { // 批10：接入 Open-Meteo 实况（免费无 key，已真机验证武汉返回）——有网自动、断网静默回退手动点选
  if (readOnly || !navigator.onLine) return;
  const c = CONFIG.CITY_COORDS[D.profile.city] || CONFIG.CITY_COORDS['武汉'];
  try {
    const acWx = new AbortController(); const toWx = setTimeout(() => acWx.abort(), 5000); // v4.1 UX 补缺：天气请求 5s 超时取消
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + c[0] + '&longitude=' + c[1] + '&daily=weather_code,apparent_temperature_max,wind_speed_10m_max&timezone=auto&forecast_days=1', { cache: 'no-store', signal: acWx.signal });
    if (!r.ok) return;
    const j = await r.json();
    const d = j.daily || {};
    const wx = wxFromCode((d.weather_code || [])[0], (d.apparent_temperature_max || [])[0], (d.wind_speed_10m_max || [])[0]);
    if (D.state.weather && D.state.weather.date === U.todayStr() && D.state.weather.manual) return; // 手改过的当天不覆盖
    D.state.weather = { date: U.todayStr(), wx: wx[0], desc: wx[1] + '·' + Math.round((d.apparent_temperature_max || [])[0]) + '°C', appMax: (d.apparent_temperature_max && d.apparent_temperature_max[0] != null) ? Math.round(d.apparent_temperature_max[0]) : null, t: Date.now() }; // v4.1 FR-D：appMax 数字键供气温提示
    D.state.updatedAt = Date.now();
    persist();
    renderToday();
  } catch (e) { /* 断网/超时：静默，手动点选兜底 */ }
}

/* ============ 批12a 记录10秒化（设计工单1）：默认值模板 + 一键保存 ============
   一键=用户对「全部完成」的主动断言，与手动勾满数据等价（K5 红线裁决：按钮必须 tap、
   副行逐字明示将存什么、部分完成永远有诚实出口）。默认值原则=只填空、不改用户已填。 */
function rpeDefaultFor(type) { // RPE 默认三级来源：近7天均值≥3条 → 上次 → 类型建议值（引用 rpeGoal 既有口径：力量7-8/有氧3-5）
  const t = U.todayStr();
  const rs = D.daily.filter((r) => r.type === type && r.rpe != null && r.date < t && r.date >= U.addDays(t, -7)).map((r) => r.rpe);
  if (rs.length >= 3) return { v: Math.round(rs.reduce((s, x) => s + x, 0) / rs.length), tag: '近7天均值' };
  if (rs.length) return { v: rs[rs.length - 1], tag: '上次' };
  return { v: (type === '力量' ? 8 : 4), tag: '建议值' };
}
function durDefaultFor(type) { // 时长默认：最近一条同类型记录（有氧优先同方式）；daily 按日期升序，取末条=最近
  const cands = D.daily.filter((r) => r.type === type && r.durationMin != null && r.date < U.todayStr());
  if (type === '有氧' && tf.cardioChoice) {
    const same = cands.filter((r) => r.cardioChoice === tf.cardioChoice);
    if (same.length) return same[same.length - 1].durationMin;
  }
  return cands.length ? cands[cands.length - 1].durationMin : null;
}
function applyTemplateToForm() { // 只填空：fDur 为空、RPE 未被用户动过才填
  const dur = document.getElementById('fDur');
  if (dur && (dur.value === '' || dur.value == null)) {
    const dv = durDefaultFor(tf.type);
    if (dv != null) dur.value = dv;
  }
  if (!tf.rpeTouched) {
    const rd = rpeDefaultFor(tf.type);
    setRpeUI(rd.v);
    tf.rpeTag = rd.tag;
  }
  updateQuickSub();
}
function quickSubText() { // 一键副行：将写入的默认值逐字展示（按下去之前看得到要存什么）
  if (CONFIG.trainTypes.indexOf(tf.type) < 0) return '不记负荷 · 足康复与八段锦按上方开关如实保存';

  if (tf.type === '力量') parts.push(CONFIG.actions.length + ' 动作全勾');
  return parts.join(' · ');
}

function partialFailCount() { // 拦截框「回去补勾」路径的 K5 计数（与原"拦截即计数"语义等价：未完成尝试记一次；连续2次触发-10%）
  D.state.strengthFails = (D.state.strengthFails || 0) + 1;
  if (D.state.strengthFails >= 2) {
    const ch2 = [];
    CONFIG.actions.forEach((a) => {
      const k = a.repsKey;
      const from = D.state.strengthReps[k];
      D.state.strengthReps[k] = Math.max(1, Math.round(from * 0.9));
      ch2.push(a.name + ' ' + from + '→' + D.state.strengthReps[k] + a.unit);
    });
    D.state.progressionLog = (D.state.progressionLog || []).concat([{ ts: Date.now(), why: '连续2次力量日未完成全部动作（各动作-10%）', what: ch2.join('、') }]).slice(-12);
    D.state.strengthFails = 0;
    toast('连续2次未完成全部动作：各动作次数已-10%（K5渐进规则）');

  D.state.updatedAt = Date.now();

  renderToday();
}

function prefillToday() {

  // 批12a：类型预填改「课表优先」（修休息日预填成上次"力量"的缺陷）——当日已有记录 > 今日课表类型 > lastForm
  const __dayTpl = effTemplate()[new Date().getDay()];
  tf.type = rec ? rec.type : (CONFIG.typeList.indexOf(__dayTpl) >= 0 ? __dayTpl : ((lf && lf.type) || '无'));
  tf.rpeTouched = false; tf.rpeTag = null; // 批12a：模板 RPE 来源标签，用户动过即失效
  tf.cardioChoice = rec ? (rec.cardioChoice || null) : ((lf && lf.cardioChoice) || null);
  // 勾选数组长度必须与动作库对齐：老记录可能短于当前动作数则补齐，多余则截断
  const ck = (rec && Array.isArray(rec.strengthChecks)) ? rec.strengthChecks.slice() : [];
  while (ck.length < CONFIG.actions.length) ck.push(false);

    tf.painText = (lf.painOpt === '其他' && lf.painText) ? lf.painText : '';

  tf.mood = rec ? (rec.mood || '') : ((lf && lf.mood) || '');
  const sf = document.getElementById('swFoot'), sb = document.getElementById('swBdj');

  setv('fDur', rec && rec.durationMin != null ? rec.durationMin : (durDefaultFor(tf.type) != null ? durDefaultFor(tf.type) : '')); // 批12a：时长默认=最近同类型（当日已有记录优先）
  if (rec && rec.rpe != null) { setRpeUI(rec.rpe); tf.rpeTouched = true; tf.rpeTag = null; } // 当日已有记录=已确认值
  else { const __rd = rpeDefaultFor(tf.type); setRpeUI(__rd.v); tf.rpeTag = __rd.tag; } // 批12a：RPE 默认三级来源（修默认 5 落进"≤7上调"污染 K5 的缺陷）
  setv('fHr', rec && rec.avgHr != null ? rec.avgHr : '');
  setv('fPainText', tf.painText);
  const pt = document.getElementById('fPainText');
  if (pt) pt.hidden = tf.painOpt !== '其他';

}

/* 力量渐进计数器（K5）：≤7加 / 8持平 / ≥9减10%；B-3：每次调整写入渐进日志供用户查看 */
function applyProgression(rpe, partial) {
  const sr = D.state.strengthReps;
  const changes = [];
  CONFIG.actions.forEach((a) => {
    const k = a.repsKey;
    const from = sr[k];
    if (rpe <= 7 && partial) return; // Codex 复核 P1-2 修复：K5 规则=全部动作标准完成才+1，部分完成持平
    if (rpe <= 7) sr[k] = sr[k] + (a.unit.indexOf('秒') >= 0 ? 5 : 1);
    else if (rpe >= 9) sr[k] = Math.max(1, Math.round(sr[k] * 0.9));
    else return; // rpe==8 → 持平，不记日志
    changes.push(a.name + ' ' + from + '→' + sr[k] + a.unit);
  });
  if (changes.length) {
    D.state.progressionLog = (D.state.progressionLog || []).concat([{
      ts: Date.now(),
      why: '保存力量日 RPE ' + rpe + (rpe <= 7 ? '（≤7 上调）' : '（≥9 下调10%）'),
      what: changes.join('、')
    }]).slice(-12);
  }
  if (!partial) D.state.strengthFails = 0; // 完整完成力量日才复位"未完成"计数；部分完成保留（K5 连续计数）
  D.state.updatedAt = Date.now();
}

function tfSave() {
  const b = document.getElementById('btnSave');
  if (b && b.disabled) return; // 防重复点击
  const fail = (m) => { if (b) { b.disabled = false; b.textContent = '保存今日记录'; } toast(m); };
  if (readOnly) { fail('离线只读模式，不能保存'); return; }
  if (b) { b.disabled = true; b.textContent = '保存中…'; }
  const rec = makeDailyRecord(U.todayStr());
  const fromWk = !!tf.fromWorkout; tf.fromWorkout = false; // N2：跟练流保存标志（用后即清）
  let strengthFull = true; // 力量日是否全勾（供 applyProgression 判断 K5 复位）
  rec.type = tf.type;
  rec.footRehab = tf.footRehab;
  rec.baduanjin = tf.baduanjin;
  if (CONFIG.trainTypes.indexOf(tf.type) >= 0) {
    const dur = U.num((document.getElementById('fDur') || {}).value);
    const rpe = U.num((document.getElementById('fRpe') || {}).value);
    if (!dur || dur <= 0) { fail('请填写时长（分钟）'); return; }
    if (rpe == null || rpe < 1 || rpe > 10) { fail('请填写体感强度 RPE（1-10）'); return; }
    rec.durationMin = dur;
    rec.rpe = rpe;
    const hr = U.num((document.getElementById('fHr') || {}).value);
    if (hr != null) rec.avgHr = hr;
  }
  const __chk = (id, lo, hi, name) => { const v = U.num((document.getElementById(id) || {}).value); if (v != null && (v < lo || v > hi)) { fail(name + '要在 ' + lo + '-' + hi + ' 之间——检查一下数值'); return true; } return false; }; // v4.1 实测修复：边界静默放行
  if (__chk('fSleep', 0, 16, '睡眠时长')) return;
  if (__chk('fRhr', 30, 150, '静息心率')) return;
  if (__chk('fHrv', 5, 300, 'HRV')) return;
  if (__chk('fDur', 1, 600, '时长（分钟）')) return;
  if (tf.type === '有氧') {
    if (!tf.cardioChoice) { fail('请选择有氧方式（3选1）'); return; }
    rec.cardioChoice = tf.cardioChoice;
  }
  if (tf.type === '力量') {
    const full = tf.checks.every(Boolean);
    strengthFull = full;
    if (!full && !fromWk) {
      // 批12a（工单1③裁决二）：拦截改三选——「回去补勾」按未完成计数（K5 同现状）；「部分完成，照实记录」=诚实出口
      const nDone = tf.checks.filter(Boolean).length;
      if (b) { b.disabled = false; b.textContent = '保存今日记录'; }
      showModal('<div class="card-title" style="margin-bottom:10px">今日未全部完成</div>'
        + '<div class="body-tx">勾选 ' + nDone + '/' + CONFIG.actions.length + ' 个动作。全部完成才计入上调；连续 2 次未完成全部动作，各动作次数 -10%（K5）。</div>'
        + '<div class="m-actions"><button class="btn-ghost" onclick="closeModal();partialFailCount()">回去补勾</button>'
        + '<button class="btn-primary" onclick="partialHonestSave()">部分完成，照实记录</button></div>');
      return;
    }
    if (!full && fromWk) { // N2：跟练部分完成 → 如实记录并计入 K5 渐进（不阻止保存，训练真实发生过）
      D.state.strengthFails = (D.state.strengthFails || 0) + 1;
      if (D.state.strengthFails >= 2) {
        const ch3 = [];
        CONFIG.actions.forEach((a) => {
          const k = a.repsKey;
          const from = D.state.strengthReps[k];
          D.state.strengthReps[k] = Math.max(1, Math.round(from * 0.9));
          ch3.push(a.name + ' ' + from + '→' + D.state.strengthReps[k] + a.unit);
        });
        D.state.progressionLog = (D.state.progressionLog || []).concat([{ ts: Date.now(), why: '连续2次力量日未完成全部动作（各动作-10%）', what: ch3.join('、') }]).slice(-12);
        D.state.strengthFails = 0;
      }
      D.state.updatedAt = Date.now();
    } else if (full) {
      D.state.strengthFails = 0;
    }
    rec.strengthChecks = tf.checks.slice();
  }
  if (tf.painOpt === '其他') {
    const p = (document.getElementById('fPainText') || {}).value || '';
    if (!p.trim()) { fail('已选"其他"疼痛，请填写部位'); return; }
    rec.pain = p.trim();
  } else {
    rec.pain = tf.painOpt;
  }
  if (!tf.mood) { fail('请选择主观状态'); return; }
  rec.mood = tf.mood;
  rec.note = ((document.getElementById('fNote') || {}).value || '').trim();
  // P1-1：记住本次选择，作为下次（新的一天）默认值
  D.state.lastForm = { type: tf.type, cardioChoice: tf.cardioChoice, painOpt: tf.painOpt, mood: tf.mood };
  D.state.updatedAt = Date.now();
  const old = M.dailyOn(rec.date);
  if (old && old.painProcessed) rec.painProcessed = true; // 防重复降级
  ['chk', 'trip'].forEach((k) => { if (old && old[k]) rec[k] = old[k]; }); // 批9走查修复：保存记录不得覆盖晨检/行后复盘（可选字段原位合并）
  recStamp(rec);
  upsertByDate(D.daily, rec);
  // 被动指标
  const oldMet = M.metricOn(rec.date);
  const met = Object.assign({}, oldMet || {}, { date: rec.date });
  met.sleepH = U.num((document.getElementById('fSleep') || {}).value);
  met.rhr = U.num((document.getElementById('fRhr') || {}).value);
  met.hrv = U.num((document.getElementById('fHrv') || {}).value);
  recStamp(met);
  upsertByDate(D.metrics, met);
  // 静息心率基线自动校准回写（估算值）
  if (D.state.autoCalibrateRHR) {
    const b = M.rhrBaseline();
    if (b && b !== D.profile.rhrBaseline) { D.profile.rhrBaseline = b; D.profile.updatedAt = Date.now(); }
  }
  // 踝痛：黄灯 + footStage-1（0不再降）
  let warn = '';
  if (R.applyAnklePain(rec)) warn = '；防崴训练已降为 Stage ' + D.state.footStage;
  // 心率硬上限提示（180-周岁，估算值）
  if (rec.avgHr != null) {
    const cap = M.hrHardCap();
    if (cap && rec.avgHr > cap) toast('平均心率 ' + rec.avgHr + ' 超过硬上限 ' + cap + '（180-周岁' + M.age() + '），请注意');
  }
  // 力量渐进（partial=跟练部分完成：保留 strengthFails 不复位）
  if (tf.type === '力量' && rec.strengthChecks && rec.rpe != null) applyProgression(rec.rpe, fromWk && !strengthFull);
  // 阶段状态机
  R.evalPhase();
  persist();
  // 连续3天足/踝痛 → 就医提示卡
  if (M.isFootAnklePain(rec.pain) && M.footPainStreak() >= CONFIG.footDoctorDays) {
    showModal('<div class="card-title" style="margin-bottom:10px">就医提醒</div>'
      + '<div class="body-tx">' + U.esc(CONFIG.copy.footDoctor) + '</div>'
      + '<div class="m-actions"><button class="btn-primary" onclick="closeModal()">知道了</button></div>');
  }
  // 备注信号引擎（批9）：保存后对备注跑关键词规则，命中给即时反馈
  const __sig = noteSignals(rec.note);
  if (__sig) {
    if (__sig.modal) openStopCard('备注命中红线信号（夜间痛/肿胀/无法承重等）——停训就医评估（K14 口径）');
    else setTimeout(() => toast(__sig.msg), 1400);
  }
  prefillToday();
  renderToday();
  // 保存反馈（P0-2）：成功绿勾+toast；失败由 persist/syncFail 提示；离线提示待同步
  const nb = document.getElementById('btnSave');
  if (nb) {
    nb.classList.add('saved');
    nb.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>已保存';
    setTimeout(() => { nb.classList.remove('saved'); nb.disabled = false; nb.textContent = '保存今日记录'; }, 1000);
  }
  if (!navigator.onLine) toast('离线模式，已存本机待同步');
  else if (warn) toast('已保存' + warn);
  else toast('已保存');
}

/* ============ SVG 图表库（原生手绘，颜色走 CSS 变量适配深色模式） ============ */
function naHint(have, need, unit) { // P1-2：空状态进度化
  let s = '<div class="sub" style="text-align:center;padding:26px 0">' + U.esc(CONFIG.copy.na);
  if (need) s += '<br>至少需要 ' + need + ' ' + U.esc(unit || '条') + '，已有 ' + (have || 0) + '，还差 ' + Math.max(0, need - (have || 0));
  return s + '</div>';
}
function chartLine(points, o) {
  const W = 340, H = 170, L = 34, Rp = 8, T = 14, B = 24;
  const pts = (points || []).filter((p) => p.y != null);
  if (pts.length < 3) return naHint(pts.length, 3, '天');
  const ys = pts.map((p) => p.y);
  if (o.baseline != null) ys.push(o.baseline);
  let ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
  if (ymax === ymin) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.15; ymin -= pad; ymax += pad;
  const X = (i) => L + (W - L - Rp) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = (v) => T + (H - T - B) * (1 - (v - ymin) / (ymax - ymin));
  const col = o.colorVar || 'var(--teal)';
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  for (let g = 1; g < 4; g++) s += '<line x1="' + L + '" y1="' + (T + (H - T - B) * g / 4).toFixed(1) + '" x2="' + (W - Rp) + '" y2="' + (T + (H - T - B) * g / 4).toFixed(1) + '" style="stroke:var(--line)"/>';
  if (o.baseline != null) {
    s += '<line x1="' + L + '" y1="' + Y(o.baseline).toFixed(1) + '" x2="' + (W - Rp) + '" y2="' + Y(o.baseline).toFixed(1) + '" style="stroke:var(--orange)" stroke-dasharray="4 3"/>'
      + '<text x="' + (W - Rp) + '" y="' + (Y(o.baseline) - 3).toFixed(1) + '" style="fill:var(--orange)" font-size="9" text-anchor="end">基线 ' + o.baseline + '</text>';
  }
  s += '<path d="' + pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ') + '" fill="none" style="stroke:' + col + '" stroke-width="2"/>';
  pts.forEach((p, i) => { s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.2" style="fill:' + col + '"/>'; });
  [0, Math.floor((pts.length - 1) / 2), pts.length - 1].forEach((i) => {
    s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 7) + '" style="fill:var(--text2)" font-size="9" text-anchor="middle">' + U.esc(pts[i].x) + '</text>';
  });
  s += '<text x="3" y="' + (T + 5) + '" style="fill:var(--text2)" font-size="9">' + Math.round(ymax) + '</text>';
  s += '</svg>';
  return s;
}
function chartBars(bars, o) {
  const W = 340, H = 170, L = 30, Rp = 8, T = 14, B = 24;
  const bs = (bars || []).filter((b) => b.y != null);
  if (bs.length < 3) return naHint(bs.length, 3, '天');
  const ys = bs.map((b) => b.y);
  if (o.refY != null) ys.push(o.refY);
  let ymax = Math.max.apply(null, ys);
  ymax += (ymax * 0.15) || 1;
  const bw = (W - L - Rp) / bs.length;
  const Y = (v) => T + (H - T - B) * (1 - v / ymax);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  for (let g = 1; g < 4; g++) s += '<line x1="' + L + '" y1="' + (T + (H - T - B) * g / 4).toFixed(1) + '" x2="' + (W - Rp) + '" y2="' + (T + (H - T - B) * g / 4).toFixed(1) + '" style="stroke:var(--line)"/>';
  if (o.refY != null) {
    s += '<line x1="' + L + '" y1="' + Y(o.refY).toFixed(1) + '" x2="' + (W - Rp) + '" y2="' + Y(o.refY).toFixed(1) + '" style="stroke:var(--orange)" stroke-dasharray="4 3"/>'
      + '<text x="' + (L + 2) + '" y="' + (Y(o.refY) - 3).toFixed(1) + '" style="fill:var(--orange)" font-size="9">' + U.esc(o.refLabel || o.refY) + '</text>';
  }
  bs.forEach((b, i) => {
    const x = L + bw * i + bw * 0.18, w = bw * 0.64;
    s += '<rect x="' + x.toFixed(1) + '" y="' + Y(b.y).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(1, H - B - Y(b.y)).toFixed(1) + '" rx="2" style="fill:' + (b.warn ? 'var(--orange)' : (o.colorVar || 'var(--blue)')) + '"/>';
    const step = bs.length <= 8 ? 1 : Math.ceil(bs.length / 6);
    if (i % step === 0) s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 7) + '" style="fill:var(--text2)" font-size="8" text-anchor="middle">' + U.esc(b.x) + '</text>';
  });
  s += '<text x="3" y="' + (T + 5) + '" style="fill:var(--text2)" font-size="9">' + Math.round(ymax) + '</text>';
  s += '</svg>';
  return s;
}
function ringSvg(frac, colorVar, size) {
  const SZ = size || 52, r = (SZ - 8) / 2, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(1, frac || 0));
  return '<svg viewBox="0 0 ' + SZ + ' ' + SZ + '" width="' + SZ + '" height="' + SZ + '">'
    + '<circle cx="' + SZ / 2 + '" cy="' + SZ / 2 + '" r="' + r + '" fill="none" style="stroke:var(--line)" stroke-width="5"/>'
    + '<circle cx="' + SZ / 2 + '" cy="' + SZ / 2 + '" r="' + r + '" fill="none" style="stroke:' + (colorVar || 'var(--accent)') + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * p).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + SZ / 2 + ' ' + SZ / 2 + ')"/></svg>';
}
/* 大数字微交互：300ms 从 0 滚动到目标值 */
function animateNum(el, target, dec, suffix) {
  const t0 = performance.now(), dur = 300;
  function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    const v = target * (1 - Math.pow(1 - k, 2));
    el.firstChild.nodeValue = v.toFixed(dec || 0) + (suffix || '');
    if (k < 1) requestAnimationFrame(step);
  }
  el.firstChild.nodeValue = (0).toFixed(dec || 0) + (suffix || '');
  requestAnimationFrame(step);
}
function bigNumHtml(id, target, dec, suffix) {
  return '<div class="big-num" id="' + id + '"><span></span></div><script type="text/plain" data-anim="' + id + '" data-v="' + target + '" data-d="' + (dec || 0) + '" data-s="' + (suffix || '') + '"></' + 'script>';
}
function runAnims(root) {
  (root || document).querySelectorAll('script[data-anim]').forEach((s) => {
    const el = document.getElementById(s.getAttribute('data-anim'));
    if (el) animateNum(el, parseFloat(s.getAttribute('data-v')), parseInt(s.getAttribute('data-d'), 10), s.getAttribute('data-s'));
    s.remove();
  });
}

/* N4 训练年历：绿系四阶 lv0无 lv1康复/八段锦打卡 lv2训练 lv3训练+打卡（DAT-2 口径） */
let heatYear = null;
function heatDayLv(ds) {
  const r = M.dailyOn(ds);
  if (!r) return 0;
  const train = CONFIG.trainTypes.indexOf(r.type) >= 0;
  const check = !!(r.footRehab || r.baduanjin);
  if (train && check) return 3;
  if (train) return 2;
  return 1;
}
function yearHeatSvg(year) {
  const start = U.weekStart(year + '-01-01'); // 年首所在周的周一（中文习惯周一开始）
  const end = year + '-12-31';
  const cells = [];
  let d = start;
  while (d <= end) {
    cells.push({ d: d, lv: (d.slice(0, 4) === String(year)) ? heatDayLv(d) : -1 });
    d = U.addDays(d, 1);
  }
  const weeks = Math.ceil(cells.length / 7);
  const CW = 13, GAP = 2, TOP = 16, LFT = 13;
  const W = LFT + weeks * (CW + GAP) + 2;
  const H = TOP + 7 * (CW + GAP) + 2;
  let mlabels = '', lastM = 0;
  cells.forEach((c, i) => {
    if (c.lv < 0) return;
    const m = +c.d.slice(5, 7);
    if (m !== lastM) { lastM = m; mlabels += '<text x="' + (LFT + Math.floor(i / 7) * (CW + GAP)) + '" y="10" font-size="9" fill="var(--text2)">' + m + '</text>'; }
  });
  const wlabels = [0, 2, 4].map((r) => '<text x="0" y="' + (TOP + r * (CW + GAP) + 10) + '" font-size="9" fill="var(--text2)">' + ['一', '三', '五'][[0, 2, 4].indexOf(r)] + '</text>').join('');
  const today = U.todayStr();
  let rects = '';
  cells.forEach((c, i) => {
    if (c.lv < 0) return;
    const x = LFT + Math.floor(i / 7) * (CW + GAP), y = TOP + (i % 7) * (CW + GAP);
    let fill = 'var(--line)', op = '0.55';
    if (c.lv === 1) { fill = 'var(--green)'; op = '0.25'; }
    else if (c.lv === 2) { fill = 'var(--green)'; op = '0.55'; }
    else if (c.lv === 3) { fill = 'var(--green)'; op = '1'; }
    const ring = c.d === today ? ' stroke="var(--accent)" stroke-width="1.5"' : '';
    rects += '<rect data-ds="' + c.d + '" x="' + x + '" y="' + y + '" width="' + CW + '" height="' + CW + '" rx="2.5" fill="' + fill + '" fill-opacity="' + op + '"' + ring + ' style="cursor:pointer"><title>' + c.d + '</title></rect>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;display:block" role="img" aria-label="训练年历">' + mlabels + wlabels + rects + '</svg>';
}
function heatShift(n) {
  heatYear = (heatYear || new Date().getFullYear()) + n;
  const el = document.getElementById('heatBox');
  if (el) el.innerHTML = yearHeatSvg(heatYear);
  const yl = document.getElementById('heatYearLabel');
  if (yl) yl.textContent = heatYear + ' 年';
  const empty = document.getElementById('heatEmpty');
  if (empty) empty.hidden = D.daily.some((r) => r.date.slice(0, 4) === String(heatYear));
}
function heatTap(e) { // 年历格子点击 → 复用月历的当天摘要弹窗（一致性）
  const t = e.target;
  const ds = t && t.getAttribute ? t.getAttribute('data-ds') : null;

/* 打卡日历（本月，周一开头；点格子看当天只读摘要） */
let calSel = null;
function calHtml() {
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth();
  const today = U.todayStr();
  const startCol = (new Date(y, mo, 1).getDay() + 6) % 7;
  const dim = new Date(y, mo + 1, 0).getDate();
  let s = '<div class="cal-head"><div class="card-title" style="margin:0">' + y + '年' + (mo + 1) + '月</div>'
    + '<div class="sub">连续打卡越久，颜色越深</div></div>';
  s += '<div class="cal">';
  ['一', '二', '三', '四', '五', '六', '日'].forEach((x) => { s += '<div class="h">' + x + '</div>'; });
  for (let i = 0; i < startCol; i++) s += '<div class="d off"></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = y + '-' + U.pad(mo + 1) + '-' + U.pad(d);
    const future = U.diffDays(today, ds) > 0;
    const r = M.dailyOn(ds);
    let cls = '', act = '';
    if (future) cls = 'off';
    else if (r) {
      if (CONFIG.trainTypes.indexOf(r.type) >= 0) {
        // P2-3：连续打卡越久颜色越深（GitHub 贡献图式）
        let run = 0, dd = ds;
        while (M.dailyOn(dd) && CONFIG.trainTypes.indexOf(M.dailyOn(dd).type) >= 0) { run++; dd = U.addDays(dd, -1); }
        cls = run >= 5 ? 't3' : (run >= 2 ? 't2' : 't1');
      }
      else if (r.footRehab || r.baduanjin) cls = 'rehab';
      else if (r.type === '休息日' || r.type === '病假') cls = 'rest';
    }
    if (!future) act = ' onclick="calTap(\'' + ds + '\', this)"';
    s += '<div class="d ' + cls + (ds === calSel ? ' sel' : '') + (ds === today ? '" style="box-shadow:inset 0 0 0 1.5px var(--accent);cursor:pointer"' : '"') + act + '>' + d + '</div>';
  }
  return s + '</div>';
}
function calTap(ds, el) {
  document.querySelectorAll('.cal .d').forEach((x) => x.classList.remove('sel'));
  if (el) el.classList.add('sel');
  showDaySummary(ds);
}

function lvFrom(map, v) {

}
function recoveryLevel() {
  const st = M.sleepStats(28), over = M.rhrOverDays(28), rd = M.rhrDataDays(28);
  if (st.withData < CONFIG.recoveryNeed || rd < CONFIG.recoveryNeed) return { lv: null, src: '近28天：睡眠 ' + st.withData + ' 天 / 静息心率 ' + rd + ' 天有数据，激活需各≥' + CONFIG.recoveryNeed + ' 天' };
  const pct = Math.round(st.ge7 / st.withData * 100);
  const T = CONFIG.recovery;
  const src = '近28天：RHR超标 ' + over + ' 天，睡眠≥7h占比 ' + pct + '%';
  if (over === 0 && pct >= T.L5.sleepPct) return { lv: 5, src: src };
  if (over === 0 && pct >= T.L4.sleepPct) return { lv: 4, src: src };
  if (over <= T.L3.over && pct >= T.L3.sleepPct) return { lv: 3, src: src };
