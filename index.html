/* N7 训练年报：全部现算零新存储；口径按 PRD DAT-3/4 */
function annualReportData(year) {
  const y = String(year);
  const ys = y + '-01-01', ye = y + '-12-31';
  if (!D.daily.length) return null;
  const days = D.daily.filter((r) => r.date >= ys && r.date <= ye);
  const trainDays = days.filter((r) => CONFIG.trainTypes.indexOf(r.type) >= 0);
  const totalMin = trainDays.reduce((s, r) => s + (r.durationMin || 0), 0);
  const mets = D.metrics.filter((m) => m.date >= ys && m.date <= ye && m.sleepH != null);
  const sleepAvg = mets.length ? Math.round(mets.reduce((s, m) => s + m.sleepH, 0) / mets.length * 10) / 10 : null;
  const painDays = days.filter((r) => r.pain && r.pain !== '无').length;
  let streak = 0, best = 0, prev = null; // 最长连续打卡（DAT-4：当天有记录且 训练/足康复/八段锦 任一为真）
  days.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((r) => {
    if (!(CONFIG.trainTypes.indexOf(r.type) >= 0 || r.footRehab || r.baduanjin)) return;
    if (prev && U.diffDays(prev, r.date) === 1) streak++; else streak = 1;
    prev = r.date;
    if (streak > best) best = streak;
  });
  const mc = {};
  trainDays.forEach((r) => { const m = +r.date.slice(5, 7); mc[m] = (mc[m] || 0) + 1; });
  let topM = null, topN = 0;
  for (let m = 1; m <= 12; m++) if ((mc[m] || 0) > topN) { topN = mc[m]; topM = m; }
  const firstDate = D.daily.reduce((a, b) => (a.date < b.date ? a : b)).date;
  const startD = ys > firstDate ? ys : firstDate;
  const endD = ye < U.todayStr() ? ye : U.todayStr();
  const fullWeeks = Math.floor((Math.max(0, U.diffDays(startD, endD) + 1)) / 7);
  const perWeek = Object.keys(effTemplate()).filter((k) => CONFIG.trainTypes.indexOf(effTemplate()[k]) >= 0).length;
  const log = (D.state.progressionLog || []).filter((e) => /深蹲 \d+→\d+/.test(e.what));
  let squatProg = null;
  if (log.length) {
    const f = log[0].what.match(/深蹲 (\d+)→(\d+)/), l = log[log.length - 1].what.match(/深蹲 (\d+)→(\d+)/);
    if (f && l) squatProg = f[1] + '→' + l[2];
  }
  return { year: year, trainDays: trainDays.length, totalMin: totalMin, sleepAvg: sleepAvg, sleepN: mets.length, painDays: painDays, best: best, topM: topM, topN: topN, planDays: fullWeeks * perWeek, squatProg: squatProg };
}
function openAnnualReport(year) {
  const nw = new Date();
  const y = year || ((nw.getMonth() === 0 && nw.getDate() <= 10) ? nw.getFullYear() - 1 : nw.getFullYear());

  { id: 'K10', group: '理念', title: 'K10 阶段全景', body: '阶段0 习惯建立(约4周)：有氧20-30分钟+力量基础+足康复Stage0+睡眠锚点<br>阶段1 有氧容量：Zone2至60分钟+下肢肌耐力+足康复Stage1<br>阶段2 爬升负重：楼梯专项+背包负重引入(5kg起)+足康复Stage2<br>阶段3 户外转移：周末真实山地、负重15kg级、背靠背两日<br><span class="sub">各阶段解锁条件与阶段状态机一致（第七部分），当前阶段见「档案与设置」。</span>' },
  { id: 'K11', group: '生活', title: 'K11 营养与体重', body: '偏瘦者(176/60, BMI 19.4)加量期原则：<br>· 不节食；训练日适当增加蛋白质与碳水(鸡蛋/奶/米饭多一口)<br>· 热量带：2400-2600 kcal/天（notes/08 §四 owner 裁决已核）——增重期"吃够"是硬指标不是可选项，热量缺口下练=掉瘦体重（Nedeltcheva 2010 实证：睡眠不足+热量限制组多丢 60% 瘦体重）<br>· 蛋白怎么落（食物版）：每日两个蛋+一盒奶打底、每餐一掌心肉/鱼/豆、练后一顿别跳——总日量优先于"练后 30 分钟窗口"（主流综述口径，标待核；g/kg 公式 1.6-2.2 同标待核，不进引擎）<br>· 每周晨起空腹称重一次(可空)；较前值降&gt;2kg→系统横幅提醒加餐；周复盘卡"体重账"按 0.5%/周带自动判读<br>· 增重节奏带子：每周涨幅不超过体重的 0.5%（59.6kg≈0.15-0.3kg/周）——这是上限不是承诺，不按月数倒推；睡眠不修，练得再狠也涨不动（Iraki 2019 （检索级核对） 0.25-0.5%/周，健美者非赛季口径→向普通训练者迁移=检索级）<br>· 目标不是减重，是让体重稳定或缓升(肌肉增长)' },
  { id: 'K12', group: '生活', title: 'K12 9/23 国民体测备战卡', body: CONFIG.k12.map((x) => '· ' + U.esc(x)).join('<br>') + '<br><span class="sub">本卡在目标页顶部 9/23 前显示、之后自动隐藏；「体测页-外部检测」折叠区常驻，不随日期关闭。</span>' },
  { id: 'K13', group: '理念', title: 'K13 高海拔行程前检查清单', body: '你有 5000 米未登顶史。任何高海拔行程（&gt;3500m）出发前必须完成：<br>· 心肺体检（心电图+血压）<br>· 阶梯适应日程（每上升 1000m 住一晚适应）<br>· 血氧仪+应急药品清单<br>· 下撤预案（什么症状必须下撤，写下来）<br><span class="sub">阶段3前仅展示、不可勾选。系统不提供"高原准备度"分数——高原适应无法在家训练，任何分数都是假的。</span>' },
  { id: 'K14', group: '康复', title: 'K14 红旗自查卡：命中立即就医/下撤', body: '看训练建议之前先过这一关。命中任意一条 → 立即就医或下撤，不要再问练不练：<br>· <b>外伤后无法承重 4 步 / 骨性压痛 / 畸形 / 关节绞锁 / 伤后 1-2h 迅速肿胀</b> → 影像就医；户外=固定+撤离<br>· <b>剧烈运动后全身肌痛加重 + 酱油色尿/尿色深如浓茶</b> → 警惕横纹肌溶解，立即就医查肌酸激酶，训练全停<br>· <b>夜间静息痛（与活动无关）/ 发热伴红肿热痛 / 不明原因消瘦</b> → 就医评估（不是训练问题）<br>· <b>高原：共济失调或意识改变（HACE）/ 静息呼吸困难（HAPE）</b> → 立即下撤，不等评分<br>· <b>寒战停止+嗜睡（中度失温）</b> → 复温+撤离；禁酒禁搓轻搬<br>· <b>突发胸闷气促胸痛</b> → 立即停止活动+急救呼叫<br><span class="sub">出处：三角色知识包·分诊红线卡（2026-09-27 对抗审查通过版；横纹肌红旗词 v4.1 M2 批补入）。今日状态卡检测到红灯词会直接引用本卡。</span>' },
  { id: 'K15', group: '训练', title: 'K15 体测报告通用建议 vs 个人红线', body: '9/23 报告"运动建议"原文三条，逐条对红线：<br>· 跳绳 <b style="color:var(--orange)">⚠️ 右脚伤愈毕业前不适用（既定康复红线）</b><br>· 跑步 <b style="color:var(--orange)">⚠️ 右脚伤愈毕业前不适用（既定康复红线）</b><br>· 深蹲跳 <b style="color:var(--orange)">⚠️ 右脚伤愈毕业前不适用（既定康复红线）</b><br>替代方案：Zone2 快走/椭圆机/游泳（足底无痛为前提）；弹跳类等阶段机放行后再说。<br><span class="sub">报告建议是给普通人的通用模板，不覆盖个人红线——这是既定原则，不是报告写错。</span>' },
  /* ---- v3.5 单元5 指南页完整版（开工单单元5；素材=notes/07/10/11 代理A起草+主会话守门通过版；检索级条目就地标注） ---- */
  { id: 'K16', group: '户外', title: 'K16 保命树①：雷电 / 雨天 / 冰雪', body: '<b>★1 高山雷电</b><br>· 判断：闪电→雷声秒数÷3=距离（公里）；≤30 秒≈10km 内=已在危险区，听到雷就开始防<br>· 动作：立即离开山脊/山口/孤树/水体/湿岩壁，往低处均匀坡或密林走；队伍拉开数米、互相看得见；雷停后再等 30 分钟才继续<br>· 禁止：躲洞口岩檐下（电弧通道）、最高点打伞竖杖、贴孤树、躺平、全队抱团<br><br><b>★2 雨天行进（看人不看雨）</b><br>· 判断：持续寒战停不下来/说话含糊/手指扣不上扣子=失温边缘；绊脚、口齿不清、拿不住东西任一=判断力在下降<br>· 动作：行进微热就减层防汗湿，一停立刻加层；贴身层湿透→避风处换干底层+热糖水；换干加餐后寒战不退→停止行进，扎营或下撤<br>· 禁止：棉质贴身（湿后失温）、硬撑到抖起来才处理、雨中久停吹风<br><br><b>★3 下雪/结冰</b><br>· 判断：脚踢测试——打滑硬响=玻璃冰不可过，能踩出印=可通过；坡上方滑倒会滑向断崖/石堆=绕行<br>· 动作：陡坡排一日最暖时段过；三点稳定、小步、重心低前倾、一次一人其他人在固定点看<br>· 要"冲一下才敢过"=改绕、改期或折返——山永远在<br><span class="sub">出处：scenarios v2 ★1-★3（NOAA/NWS、NOLS、REI 口径；2026-09-27 检索级+指南级）。</span>' },
  { id: 'K17', group: '户外', title: 'K17 保命树②：高原病 / 失温 / 求救 / 踝扭伤（队伍怎么动）', body: '<b>★4 队友疑似高原脑/肺水肿</b><br>· 判断：直线脚跟接脚尖走不稳（由同伴发起测试）、静息 10-15 分钟呼吸不平复=疑似肺水肿；走不直或意识改变=脑水肿，立即下撤不等评分<br>· 动作：≥1 人专职陪同（患者不独行）、重装分摊、先撤 300m 就开始受益；重症一边撤一边求救<br>· 禁止："睡一晚看看"、等评分再撤、患者独行、继续冲顶<br><br><b>★5 失温</b><br>· 判断：寒战停止+安静嗜睡=中度转折，是恶化不是缓解<br>· 动作：避风→垫隔地面→脱湿衣→保温毯整体包裹→暖贴放腋下/颈/躯干（隔层防烫）；中重度禁行走、意识不清禁喂任何东西；搬动要轻柔（冷心脏易骤停）<br>· 禁止：喂酒、搓四肢、直接按进热水/火边烤、让"缓过来"的人独行<br><br><b>★6 求救通道</b><br>· 能通话直接打；一格信号→发坐标短信、手机架高处省电等回；无信号→原地待援+显眼标记，一人到就近高点试信号（不大范围乱走）<br>· 报位三件套：GPS 坐标读两遍核对+两个显著地标交叉描述+人数与伤情<br>· 禁止：为找信号长时间乱走（迷路变失联）、伤员独行求救、报"大概在某山附近"就挂断<br><br><b>★7 脚踝扭伤现场</b><br>· 先停再测：完全无法承重 4 步、踝骨突剧痛任一=按疑似骨折固定撤离；肿胀前先脱鞋<br>· 能承重→缩短行程继续（减其负重、定人盯防、每 30 分钟复评）；不能→固定+撤离，走求救流程<br>· 禁止："揉一揉继续走"、当场拆绷带透气<br><span class="sub">出处：scenarios v2 ★4-★7（WMS 2024 高原病指南、Zafren 2014 失温等；2026-09-27 检索级+指南级）。红旗识别细节见 K14。</span>' },
  { id: 'K18', group: '户外', title: 'K18 ★8 手机没电怎么走（三层）', body: '<b>第一层 · 预防（出发前做满）</b><br>· 离线地图+轨迹提前下载，并在家演练调出（临场学=没有）<br>· 充电宝按天数带足、连接线一并带；低温天手机和充电宝贴身放（低温容量骤降甚至关机）<br>· 省电三件套：飞行模式（留 GPS 定位）、屏幕亮度调低、关后台刷新；轨迹记录 App 是耗电大户<br><br><b>第二层 · 电量告急（降级）</b><br>· 先关轨迹记录类 App，保留系统 GPS/指南针偶尔查看<br>· 改"定时开机打点"：每隔固定时间开机看一眼位置、读一次坐标、能发短信就报位，然后关机省电<br>· 手机贴身保温，别放外层口袋冻关机<br><br><b>第三层 · 彻底黑屏（失效）</b><br>· 纸图+指北针——行前练过才算数；装在包里没练过，和一块砖没区别<br>· 自然导航：太阳东升西落、北半球正午偏南，定大致南北；对照地形（山脊/河流走向）；顺主流向下游走通常通向有人处（经验级）<br>· 原路反追踪：沿自己的脚印/轨迹记忆退到最后一个确认点<br>· 都不行=STOP 原地待援：找显眼处、保温、留最后电量定时开机。迷路后乱走是搜索范围扩大化的第一原因<br><span class="sub">手表指针定向有区时/均时差误差陷阱，不推荐现场使用。出处：notes/07 ★8（2026-09-27 检索级多源；"顺水下行"经验级）。</span>' },
  { id: 'K19', group: '户外', title: 'K19 ★9 密草丛怎么走', body: '<b>穿着（第一有效层=物理防护）</b><br>· 长衣长裤，裤脚扎紧塞进袜筒或鞋帮；高帮徒步鞋——防蛇咬的主要物理屏障<br>· 头上戴帽檐或头灯，低头过草时挡枝条弹眼<br><br><b>杖打草（先探后踩=铁律）</b><br>· 齐膝以上草丛：先用杖左右拨探，看清落脚点再踩；踏步重一点，让震动先传出去<br>· 手不进看不见的地方：翻石头、掏石缝、抓树枝借力，一律先用杖探——让杖先接触、手不接触<br><br><b>遇蛇</b><br>· 静止或缓慢后退绕行，不挑逗不抓打；记住样子拍照，不捕不追<br>· 万一咬伤：远离蛇、清水冲洗、患肢低于心位少动、就近送医；禁嘴吸/切开/火烧/捆扎<br><br><b>蜱虫（草丛第二风险）</b><br>· 过草丛后全身检查：发际线、耳后、腋下、腰腹、腘窝<br>· 叮咬处两周内出现游走性红斑→就医；回家衣物高温烘干<br><br><b>偏方警报</b><br>· 风油精/雄黄驱蛇不可依赖——消防实验实测蛇平静穿行。防蛇=物理防护+杖打草+走现成小路+避开阴凉草丛石缝溪边<br><span class="sub">出处：notes/07 ★9（2026-09-27 检索级多源一致；"让杖先接触"替代无出处的"蛇攻杖不攻手"表述）。</span>' },
  { id: 'K20', group: '户外', title: 'K20 节奏纪律与抽筋预防（转山前必读）', body: '<b>谈话测试=可维持线</b><br>· 能正常聊整句=可维持；只能说短语=临界；说不出整句=已透支。高原上心率表和配速表都失真，体感和说话是唯一可靠的仪表<br><br><b>前半程透支=后程崩</b><br>· 出发前 1 小时刻意按比感觉慢一档走（兴奋+清晨凉爽会掩盖透支）<br>· 上坡改小步高频，不硬顶；感觉"今天状态好"恰恰是控速警钟<br><br><b>转山 3 天节奏模板</b><br>· D1 适应日：到达后缓冲 1-2 天再起转；出发段刻意放缓，全程谈话测试，晚上复盘身体信号<br>· 垭口日（卓玛拉）：早出发抢窗口；垭口前控到"能说短语"的强度；垭口短停留拍照即下；下垭口慢——碎石段慢是合理策略，不是丢人<br>· 补给节拍：每 30-60 分钟一次小补给，碳水 30-60g/h，不等饿不等渴<br>· 高走低睡：白天可走到更高，睡觉海拔尽量低<br><br><b>抽筋预防（行前侧）</b><br>· 出发前动态热身，主要发力肌群热起来再上坡<br>· 前 1 小时控速——开局兴奋期最常抽（武功山实历）<br>· 长线起步就带咸味补给（榨菜/盐丸/运动饮料），按"提前补"执行，不抽了再补；只灌白水有稀释风险<br><span class="sub">吃榨菜=你武功山实测缓解，经验级保留，不写因果；机理层如实说：主流综述（Miller/Schwellnus 2022）认为痉挛是多因素，通用补盐建议证据不足——个人验证有效可继续用。出处：notes/07 C 章+notes/08 §三（2026-09-27）。</span>' },
  { id: 'K21', group: '路线', title: 'K21 进阶路线图：五阶段与晋升技能包', body: '<b>你的位置</b>：不是零基础，是"阶段 2 卡在下坡与节奏的恢复者"——先恢复到去年走武功山的水平，再往上叠高原环线。<br><br><b>五阶段（通行进阶路径）</b><br>· 1 一日线：已过（且已超出）<br>· 2 小长线 2-4 日：客栈型已过（武功山），扎营型未验证——下一小步<br>· 3 高原环线：12 周后转山=本阶段第一线<br>· 4 重装长线（乌孙级）：远期；前置=重装过夜+导航冗余+队伍角色到收队<br>· 5 技术探险线（狼塔/鳌太）：风险量级是另一个物种，不在本周期，只作风险认知<br><br><b>晋升技能包四件（缺一件不算晋升）</b><br>· 过夜能力：帐篷选址（背风、远离河道）、炊事重量账、LNT 无痕山林七原则<br>· 导航冗余：纸图+指北针+练过——手机单导航不是冗余，是单点故障<br>· 体能阶梯：负重不超过体重 20% 硬线、10% 起步、1-2 周一档、24h 无不良反应才加+毕业线机制<br>· 队伍角色：队员→收队（压尾、盯最弱者、绝不落单）→领队<br><span class="sub">五阶段=社区共识综合（经验级偏上），产品表述为"通行路径"。出处：notes/07 B 章。</span>' },
  { id: 'K22', group: '路线', title: 'K22 线路难度谱系与三条你的线', body: '<b>先看八个维度再看档位</b>：最高海拔 / 睡眠海拔（权重更高）/ 天数 / 日均里程 / 日均爬升 / 负重 / 技术性 / 补给撤离。谱系从轻到重：<br>· L1 景区观光 → L2 经典多日线（雨崩/武功山/虎跳峡高路）→ L3 高原环线（冈仁波齐/贡嘎西南坡/洛克线）→ L4 长线重装（乌孙/夏特/狼塔）→ L5 技术探险（鳌太，单列）<br>· "轻松走遍大多数"的诚实定义=稳定站上 L3+具备 L4 重装过夜能力，不是把 L4/L5 全走一遍<br><br><b>冈仁波齐（L3 · 12 周目标线）</b><br>· 外转约 52km / 卓玛拉垭口 5630m / 3 天为主流；塔钦约 4670m 起，每晚都睡在 4670m 量级以上<br>· 技术性低——难度不在走路，在"连续 3 天睡 4670m+ 还要翻 5630m 垭口"；到达后缓冲 1-2 天再起转<br><br><b>莲宝叶则（L1 · 高海拔检阅线）</b><br>· 观光车+栈道+石坡，游览区 4000-4500m；唯一难点=当天快速暴露在 4000m+，高反风险不低<br>· 年保玉则侧已永久关闭（多源），穿越线可行性存疑；定位=冈仁波齐前后的适应/检阅线，行前查当季官方公告<br><br><b>结斯沟穿山洞雪山（L3 · 入门雪山线 · 你走过）</b><br>· 3700m 起步、山顶 4880m、往返约 12km、累计爬升约 1100m；你未登顶、自归因体力分配不均——再走前先看节奏纪律执行没执行，而不是先加体能<br><br><b>鳌太（L5 · 风险教育卡，永不种草）</b><br>· 约 120-170km（两源口径打架，待核）、多在 3000m+ 石海路段；媒体口径"国内死亡率最高的徒步线"，2018 年起明令禁止穿越<br>· 本卡唯一用途=风险认知；不进谱系推荐、不进"轻松走遍大多数"话术<br><span class="sub">出处：notes/10（2026-09-27 检索级多源；打架数字按纪律标"待核"不拍板；开放状态带检索日，行前必查官方公告）。</span>' },
  { id: 'K23', group: '路线', title: 'K23 越野跑解锁阶梯（展示页，不是课表）', body: '<b>红线前置（先说清再展示）</b><br>· 越野跑本质=跑步，跑步在你的禁区清单上（右脚伤愈毕业评审前）。这份阶梯是给你看清全貌的，不是现在开跑——"提前跑一点点试试"是红线<br>· 两把闸门缺一不可：①踝毕业评审通过 ②医生放行。任一不过=R1 不启动<br><br><b>R1 · 路跑基础（闸门全开后）</b><br>· 每周 2-3 次隔天跑，20-30 分钟轻松跑起步→渐进 40-60 分钟；全程"能边跑边交谈"的配速；平地/操场，不进山<br>· 预期管理：徒步耐力换不成跑步耐力（肌肉模式不同，不是退步）——能走一天的人，跑步可能只能维持一两个小时<br><br><b>R2 · 跑走结合进山</b><br>· 平整步道起步，跑走结合，走不丢人；越野脚感养成需 4-6 周<br>· 忘掉公路配速：越野明显更慢，用心率和体感评强度<br>· 力量配套与 R1 同步开练：保加利亚分腿蹲、单脚硬拉（下坡专项等禁区解锁，见下）<br><br><b>R3 · 技术期</b><br>· 上坡 Power Hike：手撑膝/杖前撑、重心前倾、步幅收小——陡坡上快走比跑更快更省<br>· 下坡三态：看前方不看脚、小步快频、重心微前倾提前选线；雨后湿滑/碎石段降级为走<br><br><b>下坡诚实区（对你最重要的段落）</b><br>· 下坡是越野跑核心技能，而你的下楼禁区+三次实历"下山特别慢"都指向同一处——越野跑成不成，卡点大概率在下坡<br>· 下坡能力重建是全阶梯最慢一环：毕业评审解锁前，一切下坡/下楼离心专项不排；解锁后渐进离心起步，隔 48h、酸痛期内不加第二次<br><span class="sub">本卡=解锁阶梯展示页，不是课表；课表正文等两把闸门过了按当时测试数据另出。出处：notes/11（2026-09-27 检索级；R1 起步参数保守表述）。</span>' },
  { id: 'K24', group: '理念', title: 'K24 术语→人话对照表', body: '<table class="cmp"><tr><td style="width:38%;font-weight:600">本体感觉</td><td>脚踝自己知道"踩没踩稳"的能力</td></tr><tr><td style="font-weight:600">渐进超负荷</td><td>每次只加一点点，身体才来得及变强</td></tr><tr><td style="font-weight:600">RIR（储备次数）</td><td>做完这组还剩几次力气</td></tr><tr><td style="font-weight:600">离心/慢放</td><td>动作里"慢慢放下"的那半程</td></tr><tr><td style="font-weight:600">DOMS 延迟性酸痛</td><td>练完第二天才来的酸，24-72 小时到顶</td></tr><tr><td style="font-weight:600">LSI 患健比</td><td>伤腿成绩是健康腿的百分之几</td></tr><tr><td style="font-weight:600">Zone 2</td><td>能说整句话、不能唱歌的强度</td></tr><tr><td style="font-weight:600">VO2max 最大摄氧量</td><td>身体用氧的发动机排量</td></tr><tr><td style="font-weight:600">AMS 急性高山病</td><td>上高原后头疼乏力那套反应</td></tr><tr><td style="font-weight:600">HACE 脑水肿</td><td>高原病最危险的脑部形态，走路走不直就要命</td></tr><tr><td style="font-weight:600">HAPE 肺水肿</td><td>高原病肺部形态，不动也喘就要命</td></tr><tr><td style="font-weight:600">Tandem gait</td><td>直线脚跟接脚尖走——测脑子稳不稳的现场检查</td></tr><tr><td style="font-weight:600">PEACE&amp;LOVE</td><td>伤后 48 小时的保护规矩+之后的科学动起来</td></tr><tr><td style="font-weight:600">静息心率基线</td><td>你睡醒时心跳的"平时水平"</td></tr><tr><td style="font-weight:600">HRV 心率变异性</td><td>身体恢复度的电表，低了就是没缓过来</td></tr><tr><td style="font-weight:600">超补偿</td><td>练→吃→睡→变强的循环</td></tr><tr><td style="font-weight:600">中枢敏化</td><td>神经把疼痛音量调太大，病好了还疼</td></tr><tr><td style="font-weight:600">恐惧回避</td><td>因为怕疼不敢动，越不动越废</td></tr><tr><td style="font-weight:600">等长收缩</td><td>顶住不动但肌肉发力的静力练习</td></tr><tr><td style="font-weight:600">代偿</td><td>该发力的肌肉偷懒，别的部位替它挨打</td></tr></table><span class="sub" style="margin-top:8px">出处：SKILL.md v2 术语人话表（2026-09-27 对抗审查通过版），照搬。</span>' }
  ,{ id: 'K27', group: '生活', title: 'K27 食物热量速查：20 个常见食物（只查询不打卡）', body: 'Keep 抄单小件（v4.1）：增重吃账的查询工具——不打卡、不记录，想知道吃什么对照一眼。<br><table class="cmp"><tr><td style="font-weight:600">食物（每 100g 可食部）</td><td>热量 kcal</td><td>蛋白 g</td></tr>'
    + '<tr><td>米饭（熟）</td><td>116</td><td>2.6</td></tr><tr><td>馒头</td><td>223</td><td>7.0</td></tr><tr><td>面条（煮）</td><td>110</td><td>3.6</td></tr><tr><td>全麦面包</td><td>246</td><td>9.0</td></tr><tr><td>燕麦片（干）</td><td>367</td><td>15</td></tr><tr><td>红薯</td><td>86</td><td>1.6</td></tr><tr><td>土豆</td><td>77</td><td>2.0</td></tr><tr><td>鸡蛋（整）</td><td>144</td><td>13.3</td></tr><tr><td>鸡胸肉</td><td>133</td><td>24</td></tr><tr><td>鸡腿肉（去皮）</td><td>146</td><td>20</td></tr><tr><td>瘦猪肉</td><td>143</td><td>20</td></tr><tr><td>牛腱子</td><td>115</td><td>20</td></tr><tr><td>三文鱼</td><td>139</td><td>18</td></tr><tr><td>虾</td><td>93</td><td>18.6</td></tr><tr><td>豆腐</td><td>81</td><td>8.1</td></tr><tr><td>牛奶</td><td>54</td><td>3.0</td></tr><tr><td>无糖酸奶</td><td>72</td><td>2.8</td></tr><tr><td>花生</td><td>574</td><td>24.8</td></tr><tr><td>西兰花</td><td>34</td><td>2.8</td></tr><tr><td>香蕉</td><td>93</td><td>1.4</td></tr></table>'
    + '<span class="sub" style="margin-top:8px">约值，供估算对照；精确值看包装营养表。增重口径（FR-8）：盈余靠三餐+练后一顿加起来，不是猛灌零食——脾虚湿盛肠胃差，少食多餐比一顿硬塞强。</span>' }
  ,{ id: 'K28', group: '户外', title: 'K28 武汉训练场地与室内替代（冬训主场指南）', body: '冬训期（2026-10~2027-03）去哪练、什么天气换什么课、负重怎么背不出事。检索级口径（2026-09-30），数字打架处保留待核。<br><b>一、户外场地速查</b><br><table class="cmp"><tr><td style="font-weight:600;white-space:nowrap">情况</td><td>去哪</td><td>练什么</td></tr><tr><td>天气好</td><td>汉口/青山江滩、东湖绿道</td><td>Zone2 长走+负重适应（青山江滩 7.5km 两来源一致；汉口江滩约 8km 含四期，一二期 3.4km 为官方旧口径）</td></tr><tr><td>想加爬升</td><td>喻家山 149.5m / 珞珈山 118.5m / 磨山 116.3m / 八分山 272.3m / 马鞍山约 136m</td><td>一山上一下×N 组，组数堆爬升不硬撑单次</td></tr><tr><td>小雨</td><td>青山江滩（透水铺装）或绿道</td><td>平路课，减速防滑</td></tr><tr><td>大雨大雪冰冻</td><td>室内三件套</td><td>楼梯爬层课 / 跟练加长 / 每日包加量</td></tr></table>'
    + '<br><b>二、爬升换算与场地</b>：产品口径 1 层≈3m，堆 300m 爬升≈100 层楼梯，分 3-5 组别一口气。绿道主线=平路里程机（总长 105km，2024 政府口径成环；101.98km 系 2017 旧值），爬升要拐进磨山景区/马鞍山或山体公园；喻家山/珞珈山进校预约政策待核（出行前查校方公众号）。<br>'
    + '<b>三、雨雪天楼梯课硬规则（逐条是规则不是建议）</b>：只上不下，下楼乘电梯——下楼冲击+楼道湿滑=伤膝和摔倒双重风险；全程一手扶扶手；组间在平台站稳不坐台阶；鞋底湿先进楼擦底或换干鞋；楼道灯不亮/地面反潮发亮→当天取消改跟练加长；中途胸闷头晕腿软→立刻停，扶扶手走到电梯层乘电梯下楼。<br>'
    + '<b>四、负重长走铁律</b>：起步 2kg（两瓶水/米袋塞包底，重心贴背中上部），第一次从江滩平路开始不上台阶；每周 2 次负重课其余空包；<b>加重量就不加路程，加路程就不加重量，不同时加</b>；出发前 30 秒查腰带传导（重量落髋，肩带贴合不勒胸）——转山当天就是这个背法。碎石/下坡一律减速，步幅缩短一半，踩实再移重心；本卡不排下坡专项，下坡变快的唯一合法路径=低负重多次安全通过。<br>'
    + '<b>五、武汉湿冷条款</b>：三层穿法（内层排汗不穿纯棉+中层抓绒+外层防风壳，江边风大防风比厚重要）；手套帽子必带；走热开拉链散热别一次脱中层，停下前拉回去；课完 10 分钟内换干衣干袜（湿袜=水泡加速器）；桥面/背阴石阶/木栈道最先结冰挂霜，路面反光发亮一律按冰面处理。<br>'
    + '<span class="sub" style="margin-top:8px">检索级标注（2026-09-30，7 次检索）：青山江滩 7.5km/喻家山 149.5m 两来源一致；首轮 5 处待核已二轮检索收敛（2026-10-01：磨山 116.3m——常见 118m 系珞珈山混淆、八分山 272.3m、马鞍山约 136m、汉口江滩约 8km 含四期、东湖绿道 105km）。进校预约与冬季开放时间待核，出行前另查。</span>' }
];
const K_GROUPS = ['理念', '训练', '康复', '生活', '户外', '路线'];

/* ============ Tab5 指南 ============ */
function renderGuideTab() {
  updateSyncBadge();
  const box = document.getElementById('guideTabBody');
  const q = (window.__kq || '').trim();
  let h = '<input class="k-search" id="kSearch" placeholder="搜索知识卡标题" value="' + U.esc(window.__kq || '') + '" oninput="kFilter(this.value)">';
  K_GROUPS.forEach((g) => {
    const cards = CONFIG.knowledge.filter((k) => k.group === g && (!q || k.title.indexOf(q) >= 0 || k.id.indexOf(q.toUpperCase()) >= 0));
    if (!cards.length) return;
    h += '<div class="k-group">' + g + '</div>';
    h += cards.map((k) => '<div class="card k-card' + (window.__kOpen === k.id ? ' open' : '') + '" id="kc_' + k.id + '">'
      + '<div class="k-head" onclick="kToggle(\'' + k.id + '\')"><div class="k-title">' + U.esc(k.title) + '</div></div>'
      + '<div class="k-body">' + (typeof k.bodyFn === 'function' ? k.bodyFn() : k.body) + '</div></div>').join('');
  });
  if (q && h.indexOf('k-card') < 0) h += '<div class="card empty-card"><div class="card-title">没有匹配的知识卡</div></div>';
  box.innerHTML = h;
}
function kToggle(id) {
  window.__kOpen = (window.__kOpen === id) ? null : id;
  const el = document.getElementById('kc_' + id);
  if (el) el.classList.toggle('open');
}
function kFilter(v) { window.__kq = v; const sc = window.scrollY; renderGuideTab(); const i = document.getElementById('kSearch'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } window.scrollTo(0, sc); }

/* ============ 体测页（6组11字段 + 外部检测 + 历史对比） ============ */
const TEST_DIRS = { rhr7: -1, stepPeakHr: -1, stepHrDrop1min: 1, squatMax: 1, pushupMax: 1, standL: 1, standR: 1, plankSec: 1, sideL: 1, sideR: 1 };
const EXT_DIRS = { '体重': -1, '体脂率': -1, '肺活量': 1, '台阶指数': 1, '握力': 1, '俯卧撑': 1, '坐位体前屈': 1, '闭眼单脚站立': 1, '选择反应时': -1, '背力': 1, '最大摄氧量': 1, '纵跳': 1, '体测总分': 1, '血压': 0, '静息心率': -1 };
/* W1：外部检测的字段清单。renderTest / saveExternal / testHistoryHtml 三处都引用它，
   此前只有使用没有定义，一进体测页就抛 TypeError（Cannot read properties of undefined），
   整个页面渲染中断。必须放在 EXT_DIRS 之后——它依赖 Object.keys(EXT_DIRS)。
   在 11 项国民体质监测标准项之外，补「身高」（BMI 必需）与「BMI」（偏瘦体质关键追踪指标）。 */
CONFIG.externalItems = ['身高'].concat(Object.keys(EXT_DIRS)).concat(['BMI']);
function renderTest() {
  updateSyncBadge();
  const groups = [
    { name: '① 静息心率', hint: '方法：取近7天静息心率均值，从健康App抄录。', fields: [['tRhr7', '近7天静息心率均值', '如 60']] },
    { name: '② 台阶试验', hint: '方法：30-40cm台阶，60步/分，3分钟，佩戴Apple Watch，结束后从健康App抄峰值心率+结束后1分钟下降值。', fields: [['tStepPeak', '台阶峰值心率', '如 132'], ['tStepDrop', '结束后1分钟下降值', '如 28']] },
    { name: '③ 力量', hint: '方法：深蹲、俯卧撑各做到力竭，记最多次数（动作标准优先）。', fields: [['tSquat', '深蹲最多次数', '如 30'], ['tPushup', '俯卧撑最多次数', '如 20']] },
    { name: '④ 闭眼单腿站立', hint: '安全提示：站在墙或椅旁；右足疼痛日改睁眼并标注；建议足康复 Stage 1 完成后再测闭眼项目。', fields: [['tStandL', '左侧秒数', '如 25'], ['tStandR', '右侧秒数', '如 18']] },
    { name: '⑤ 核心', hint: '方法：平板支撑与左右侧支撑各记最长坚持秒数。', fields: [['tPlank', '平板支撑秒数', '如 75'], ['tSideL', '左侧支撑秒数', '如 40'], ['tSideR', '右侧支撑秒数', '如 38']] },
    { name: '⑥ 柔韧性备注', hint: '方法：主观记录活动度受限情况（可选文字）。', fields: [['tMobility', '柔韧性备注', '如 腘绳肌紧']] }
  ];
  let h = '<button class="btn-ghost" onclick="nav(\'pgProfile\')">← 返回档案</button>';
  h += '<div class="card" style="margin-top:12px"><div class="card-title" style="margin-bottom:12px">家庭体测（6组 / 11字段）</div>'
    + '<div class="field"><label>体测日期</label><input id="tDate" type="date" value="' + U.todayStr() + '"></div>';
  groups.forEach((g) => {
    h += '<div class="field"><label style="font-weight:600;color:var(--text)">' + g.name + '</label><div class="sub" style="margin:2px 0 8px">' + U.esc(g.hint) + '</div>';
    g.fields.forEach((f) => { h += '<div class="field"><label>' + U.esc(f[1]) + '</label><input id="' + f[0] + '" inputmode="decimal" placeholder="' + U.esc(f[2]) + '"></div>'; });
    h += '</div>';
  });
  h += '<button class="btn-primary" onclick="saveTest()">保存本次体测</button></div>';
  h += '<div class="card"><details class="fold" style="margin:0;background:transparent;padding:0"><summary>外部检测录入（常驻，来源默认武汉国民体质监测中心）</summary><div class="fold-body">'
    + '<div class="field"><label>检测日期</label><input id="eDate" type="date" value="' + U.todayStr() + '"></div>'

    + CONFIG.externalItems.map((k) => '<div class="field"><label>' + U.esc(k) + '</label><input id="e_' + U.esc(k) + '" placeholder="可留空"></div>').join('')

/* W9（P0）体测→计划联动：把体测的力竭值折半写入训练起点，打通「测评→计划」这条断掉的闭环。
   力竭×50% 留余量，符合渐进原则；箭步蹲/臀桥体测没有对应项，保持现有渐进值不动。
   返回变化清单，供保存提示展示（让用户知道计划为什么变了）。 */
function applyTestToPlan(rec) {
  const sr = D.state.strengthReps;
  const half = (v) => Math.max(1, Math.round(v * 0.5)); // 力竭×50%，至少 1
  const changed = [];
  const put = (key, v, label) => {
    if (v == null || !(v > 0)) return;
    const nv = half(v);
    if (sr[key] !== nv) changed.push((label || key) + ' ' + (sr[key] == null ? '—' : sr[key]) + '→' + nv);
    sr[key] = nv;
  };
  put('深蹲', rec.squatMax);
  // 档位判断（9/26 对抗审查结论：标准俯卧撑对力竭 22 者为无效组）——力竭 >20 时计划目标
  // 切到下斜俯卧撑，否则维持标准俯卧撑；只切目标键，不删除旧键（历史数据兼容）。
  put(rec.pushupMax > 20 ? '下斜俯卧撑' : '俯卧撑', rec.pushupMax, rec.pushupMax > 20 ? '下斜俯卧撑(档位)' : null);
  put('平板', rec.plankSec);
  // 侧桥取较差侧：左右不平衡时以弱侧为准，避免高估
  if (rec.sideL != null && rec.sideR != null && rec.sideL > 0 && rec.sideR > 0) put('侧桥', Math.min(rec.sideL, rec.sideR));
  D.state.updatedAt = Date.now();
  return changed;
}

/* ============ 档案页（iOS设置页风格分组列表） ============ */
/* N5 课表文本化 v1：周模板+组次可编辑；动作名/星期写法固定；解析失败不生效（回滚） */
let schedCache = null; // {tpl:{0..6}, sets:{repsKey:n}}
function parseSchedule(text) {
  const WD = { '周一': 1, '周二': 2, '周三': 3, '周四': 4, '周五': 5, '周六': 6, '周日': 0 };
  const OKT = ['力量', '有氧', '长时活动', '休息日'];
  const sec = { tpl: null, sets: {} };
  const lines = String(text || '').split('\n');
  let zone = '';
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw || raw.charAt(0) === '#') continue;
    if (raw.charAt(0) === '[') {
      zone = (raw.indexOf('周模板') >= 0) ? 'tpl' : (raw.indexOf('目标组次') >= 0 ? 'sets' : '');
      if (!zone) throw { line: i + 1, msg: '未知段落 ' + raw };
      continue;
    }
    const ei = raw.indexOf('=');
    if (ei <= 0) throw { line: i + 1, msg: '这一行缺少 = ' };
    const k = raw.slice(0, ei).trim(), v = raw.slice(ei + 1).trim();
    if (zone === 'tpl') {
      if (!(k in WD)) throw { line: i + 1, msg: '星期写法应为 周一~周日：' + k };
      if (OKT.indexOf(v) < 0) throw { line: i + 1, msg: '类型只能是 力量/有氧/长时活动/休息日：' + v };
      sec.tpl = sec.tpl || {};
      sec.tpl[WD[k]] = v;
    } else if (zone === 'sets') {
      const m = v.match(/^(\d+)x(\d+)$/);
      const a = CONFIG.actions.filter((x) => x.repsKey === k)[0];
      if (!a) throw { line: i + 1, msg: '动作名不存在（动作名不可改）：' + k };
      if (!m) throw { line: i + 1, msg: '格式应为 组数x次数：' + v };
      const st = +m[1], rp = +m[2];
      if (st < 1 || st > 5 || rp < 1 || rp > 60) throw { line: i + 1, msg: '组数 1-5、次数 1-60：' + v };
      sec.sets[k] = st;
      sec['reps_' + k] = rp;
    }
  }
  if (!sec.tpl || Object.keys(sec.tpl).length !== 7) throw { line: 0, msg: '周模板必须完整填写周一到周日' };
  // 动作库扩充后，用户已保存的老课表可能缺少新动作。
  // 这里自动补齐默认组次，而不是抛错——抛错会让用户辛苦调好的整份课表被回滚清空。
  sec.sets = sec.sets || {};
  for (let ai = 0; ai < CONFIG.actions.length; ai++) {
    const rk = CONFIG.actions[ai].repsKey;
    if (!(rk in sec.sets)) sec.sets[rk] = 3;
  }
  return sec;
}
function rebuildSched() { // 从 scheduleText 重建生效缓存；解析失败回滚内置课表
  schedCache = null;
  if (D && D.state.scheduleText) {
    try { schedCache = parseSchedule(D.state.scheduleText); }
    catch (e) { schedCache = null; D.state.scheduleText = null; }
  }
}
function effTemplate() { return (schedCache && schedCache.tpl) || CONFIG.weekTemplate; }
function effSets(k) { return (schedCache && schedCache.sets && schedCache.sets[k]) || 3; }
function generateScheduleText() { // 由现行生效课表生成文本（组次显示当前目标值）
  const tpl = effTemplate();
  const WDR = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  let t = '# 课表（只改数字；动作名与星期写法不可改）\n[周模板]\n';
  [1, 2, 3, 4, 5, 6, 0].forEach((k) => { t += WDR[k] + '=' + tpl[k] + '\n'; });
  t += '\n[目标组次]（组数x次数；改这里会直接更新训练目标）\n';
  CONFIG.actions.forEach((a) => { t += a.repsKey + '=' + effSets(a.repsKey) + 'x' + (D.state.strengthReps[a.repsKey] || 10) + '\n'; });
  return t;
}
function applySchedule() {
  if (readOnly) { toast('离线只读模式，不能修改'); return; }
  const ta = document.getElementById('schedText');
  const text = ta ? ta.value : '';
  let sec;
  try { sec = parseSchedule(text); }
  catch (e) { toast((e.line ? '第 ' + e.line + ' 行：' : '') + e.msg + '（未生效）'); return; }
  D.state.scheduleText = text;
  schedCache = sec;
  const changed = [];
  CONFIG.actions.forEach((a) => {
    const rp = sec['reps_' + a.repsKey];
    if (rp != null && D.state.strengthReps[a.repsKey] !== rp) {
      changed.push(a.repsKey + ' ' + D.state.strengthReps[a.repsKey] + '→' + rp);
      D.state.strengthReps[a.repsKey] = rp;
    }
  });
  D.state.updatedAt = Date.now();
  persist();
  renderProfile();
  toast(changed.length ? '课表已生效：' + changed.join('、') : '课表已生效');
}
function resetSchedule() {
  if (readOnly) { toast('离线只读模式，不能修改'); return; }
  D.state.scheduleText = null;
  rebuildSched();
  D.state.updatedAt = Date.now();
  persist();
  renderProfile();
  toast('已恢复内置课表（训练目标保留现值）');
}

  window.__bf = { date: '', type: '无', cardioChoice: null, checks: CONFIG.actions.map(function () { return false; }), dur: '', rpe: '', hr: '', painOpt: '无', painText: '', mood: '', footRehab: false, baduanjin: false, sleep: '', rhr: '', hrv: '', note: '' };
  const isEdit = !!(preset && M.dailyOn(preset));

function bfPickDate(v) {

function bfField(k, v) { window.__bf[k] = v; }
function bfSave() {
  if (readOnly) { toast('离线只读模式，不能保存'); return; }
  const s = window.__bf;
  if (!s || !s.date) { toast('请先选择日期'); return; }
  if (s.date >= U.todayStr()) { toast('补录日期必须是今天之前'); return; }
  const rec = makeDailyRecord(s.date);
  rec.type = s.type;
  rec.footRehab = !!s.footRehab;
  rec.baduanjin = !!s.baduanjin;
  if (CONFIG.trainTypes.indexOf(s.type) >= 0) {
    const dur = U.num(s.dur), rpe = U.num(s.rpe);
    if (!dur || dur <= 0) { toast('请填写时长（分钟）'); return; }
    if (rpe == null || rpe < 1 || rpe > 10) { toast('请填写体感强度 RPE（1-10）'); return; }
    rec.durationMin = dur;
    rec.rpe = rpe;
    const hr = U.num(s.hr);
    if (hr != null) rec.avgHr = hr;
  }
  if (s.type === '有氧') {
    if (!s.cardioChoice) { toast('请选择有氧方式'); return; }
    rec.cardioChoice = s.cardioChoice;
  }
  if (s.type === '力量') rec.strengthChecks = s.checks.slice(); // 照实记录；补录不触发渐进与 K5 计数
  rec.pain = s.painOpt === '其他' ? (s.painText || '').trim() : s.painOpt;
  if (s.painOpt === '其他' && !rec.pain) { toast('已选"其他"疼痛，请填写部位'); return; }
  if (!s.mood) { toast('请选择主观状态'); return; }
  rec.mood = s.mood;
  rec.note = (s.note || '').trim();
  const old = M.dailyOn(s.date);
  if (old && old.painProcessed) rec.painProcessed = true; // 防重复降级
  recStamp(rec);
  upsertByDate(D.daily, rec);
  const met = Object.assign({}, M.metricOn(s.date) || {}, { date: s.date });
  const hadMetric = !!M.metricOn(s.date);
  // 条件写入：输入框留空代表「这次没测」，不能覆盖历史数值。
  // 原实现直接赋值 U.num('') = null，会把已有指标抹成空，等于每次保存都丢数据。
  if (s.sleep !== '') { const v = U.num(s.sleep); if (v != null) met.sleepH = v; }
  if (s.rhr !== '') { const v = U.num(s.rhr); if (v != null) met.rhr = v; }
  if (s.hrv !== '') { const v = U.num(s.hrv); if (v != null) met.hrv = v; }
  // 三项都为空且此前无指标记录时不写入空壳；否则照常保存
  if (met.sleepH != null || met.rhr != null || met.hrv != null || hadMetric) {
    recStamp(met);
    upsertByDate(D.metrics, met);
  }
  let warn = '';
  if (R.applyAnklePain(rec)) warn = '；防崴训练已降为 Stage ' + D.state.footStage; // 踝痛降级照常（规则一致性）
  R.evalPhase();
  persist();
  if (M.isFootAnklePain(rec.pain) && M.footPainStreak() >= CONFIG.footDoctorDays) {
    showModal('<div class="card-title" style="margin-bottom:10px">就医提醒</div>'
      + '<div class="body-tx">' + U.esc(CONFIG.copy.footDoctor) + '</div>'
      + '<div class="m-actions"><button class="btn-primary" onclick="closeModal()">知道了</button></div>');
    warn = '';
  }
  closeModal();
  renderToday();
  toast('已补录 ' + s.date + (warn ? warn : ''));
}

/* v3.3 阶段机对齐：0→3 阶段挂"不合格→合格→习惯→加量"业务名。
   合格线只列有依据的两条（总评≥60=国民体质评级合格档；右脚≥47s=康复工程 75% 日常门槛），

function stageWeaknessHtml() {
  const names = ['不合格期', '合格期', '习惯期', '加量期'];
  const ph = Math.min(D.state.phase || 0, names.length - 1); // 防御：phase 异常越界时不显示 undefined
  const ext = D.external.length ? D.external[D.external.length - 1] : null;
  const it = (ext && ext.items) || {};
  const tests = M.latestTest();
  const row = (label, cur, line) => '<tr><td>' + label + '</td><td>' + (cur == null ? '—' : cur) + '</td><td>' + line + '</td></tr>';
  return '<div class="card"><div class="card-title" style="margin-bottom:6px">阶段对齐：不合格 → 合格 → 习惯 → 加量</div>'
    + '<div class="sub" style="margin-bottom:8px">当前是阶段 ' + ph + '（' + names[ph] + '），毕业条件见上。</div>'
    + '<table class="cmp"><tr><th>弱项</th><th>当前</th><th>合格线</th></tr>'
    + row('体测总分', it['体测总分'] == null ? null : U.esc(it['体测总分']), '≥60（国民体质评级合格档）')
    + row('右脚闭眼单腿站立', tests && tests.standR != null ? tests.standR + 's' : null, '≥47s（康复期 75% 日常门槛）')
    + row('最大摄氧量', it['最大摄氧量'] == null ? null : U.esc(it['最大摄氧量']), '以报告评级为准')
    + row('纵跳', it['纵跳'] == null ? null : U.esc(it['纵跳']), '以报告评级为准')
    + row('坐位体前屈', it['坐位体前屈'] == null ? null : U.esc(it['坐位体前屈']), '以报告评级为准')
    + '</table><div class="sub" style="margin-top:6px">数据源：体测页外部检测最新一次' + (ext ? '（' + U.esc(ext.date) + '）' : '——还没录，去体测页补') + '；右脚取家庭体测最新一次。</div></div>';
}

function aiSetProvider(id) { // 预设切换：url+model 一键填好
  const p = AI_PROVIDERS.find((x) => x.id === id);
  if (!p) return;
  D.state.aiCfg = { provider: p.id, url: p.url, model: p.model, moreBody: (aiCfg().moreBody || false) };
  D.state.updatedAt = Date.now();
  persist();
  renderProfile();
}
function aiSetCustom() { // 自定义供应商：读当前输入框值保存（url 解除只读可改）
  const u = ((document.getElementById('aiUrl') || {}).value || '').trim();
  const m = ((document.getElementById('aiModel') || {}).value || '').trim();
  D.state.aiCfg = { provider: 'custom', url: u, model: m, moreBody: (aiCfg().moreBody || false) };
  D.state.updatedAt = Date.now();
  persist();
  renderProfile();
  toast('已保存自定义接口配置');
}
function aiSaveKey() {
  const el = document.getElementById('aiKeyInput');
  const v = el ? el.value.trim() : '';
  if (!v) { toast('先粘贴 Key'); return; }
  try { localStorage.setItem('tineng_aikey', v); } catch (e) { toast('本机存储不可用'); return; }
  toast('Key 已保存（仅本机，不同步）');
  renderProfile();
}
function aiClearKey() {
  try { localStorage.removeItem('tineng_aikey'); } catch (e) {}
  toast('已清除 Key');
  renderProfile();
}
function aiToggleBody(on) {
  D.state.aiCfg = aiCfg();
  D.state.aiCfg.moreBody = on;
  D.state.updatedAt = Date.now();
  persist();
}
function aiTestKey() { // 最小请求验证 url+key+model 三件套
  const k = aiKey();
  if (!k) { toast('先保存 Key 再测试'); return; }
  toast('测试中…');
  fetch(aiCfg().url, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: aiCfg().model, messages: [{ role: 'user', content: '回复"通"一个字' }], max_tokens: 8 })
  }).then((r) => {
    if (r.status === 401 || r.status === 403) { toast('Key 无效或过期'); return null; }
    if (!r.ok) { toast('接口异常（' + r.status + '），检查地址与模型名'); return null; }
    return r.json();
  }).then((j) => {
    if (j && j.choices && j.choices[0]) toast('连接成功，可以开问');
    else if (j) toast('接口返回异常，检查模型名');
  }).catch(() => toast('连不上（网络或地址问题）'));
}

function saveProfileEdit() {
  if (readOnly) { toast('离线只读模式，不能保存'); return; }
  const p = D.profile;
  const h = U.num(document.getElementById('pHeight').value);
  const w = U.num(document.getElementById('pWeight0').value);
  if (!h || !w) { toast('身高、体重为必填'); return; }
  p.gender = document.getElementById('pGender').value;
  p.height = h;
  p.weight0 = w;
  p.weeklyDays = U.num(document.getElementById('pWeekly').value) || 6;
  p.stairs = document.getElementById('pStairs').checked;
  p.gear = document.getElementById('pGear').value.trim();
  p.injury = document.getElementById('pInjury').value.trim() || CONFIG.copy.injuryPreset;
  p.targetWindow = document.getElementById('pTarget').value.trim() || null;
  const r = U.num(document.getElementById('pRhr').value);
  if (r != null && r !== p.rhrBaseline) {
    p.rhrBaseline = r;
    D.state.autoCalibrateRHR = false; // 手动改后自动关
    toast('静息心率基线已手动设为 ' + r + '，自动校准已关闭');
  }
  const hv = U.num(document.getElementById('pHrv').value);
  if (hv != null) p.hrvBaseline = hv;
  const sl = U.num(document.getElementById('pSleep').value);
  if (sl != null) p.sleepBaseline = sl;
  p.updatedAt = Date.now();
  D.state.updatedAt = Date.now();
  persist();
  renderProfile();
  toast('档案已保存');
}

function promoteFoot() {
  if (readOnly) { toast('离线只读模式，改动不保存'); return; } // Codex 复核 P2-1 修复：补只读守卫
  const st = D.state.footStage;
  if (st >= 2) { closeModal(); return; }
  if (st === 0) {
    const ok = document.getElementById('pmConfirm').checked;
    if (!ok) { toast('请先确认近7天行走疼痛≤2/10'); return; }
    D.state.footStage = 1;
  } else {
    const need = 45; // 估算值：Stage1→2 睁眼单腿45秒
    const l = U.num(document.getElementById('pmL').value);
    const r = U.num(document.getElementById('pmR').value);
    if (l == null || r == null) { toast('请填写左右秒数'); return; }
    if (M.footPainFreeDays() < 14) { toast('连续无足/踝痛未满14天（当前 ' + M.footPainFreeDays() + ' 天），暂不晋级'); return; }
    if (l < need || r < need) { toast('睁眼单腿需左右均≥' + need + '秒'); return; }
    D.state.footStage = 2;
  }
  D.state.updatedAt = Date.now();
  persist();
  closeModal();
  renderProfile();
  toast('足康复晋级：Stage ' + D.state.footStage);
}

function exportData() {
  const payload = Object.assign({}, D, { updatedAt: new Date().toISOString() });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '体能系统备份-' + U.todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('备份已导出');
}
function importData(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (f.size > CONFIG.IMPORT_MAX_BYTES) { toast('导入失败：文件超过 10MB，已拒收'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    let obj = null;
    try { obj = JSON.parse(rd.result); } catch (e) { toast('导入失败：不是合法 JSON'); return; }
    if (!obj || typeof obj !== 'object' || !obj.profile || typeof obj.profile !== 'object' || !obj.state || typeof obj.state !== 'object' || !Array.isArray(obj.daily) || !Array.isArray(obj.metrics)) {
      toast('导入失败：格式校验不通过'); return;
    }
    D = normalizeData(obj);
    rebuildSched(); // Codex 复核 P1-3 修复：导入可能带自定义课表，立即重建生效缓存（否则 effSets 沿用旧表到重启）
    persist();
    renderProfile();
    updateSyncBadge();
    // "导入成功：X条记录，时间范围 YYYY-MM-DD 至 YYYY-MM-DD"
    const dates = [];
    ['daily', 'metrics', 'tests', 'external'].forEach((k) => D[k].forEach((r) => { if (r.date) dates.push(r.date); }));
    D.weekly.forEach((r) => { if (r.weekStart) dates.push(r.weekStart); });
    let msg = '导入成功：' + recCount(D) + ' 条记录';
    if (dates.length) {
      dates.sort();
      msg += '，时间范围 ' + dates[0] + ' 至 ' + dates[dates.length - 1];
    }
    toast(msg);
  };
  rd.onerror = () => toast('读取文件失败');
  rd.readAsText(f, 'utf-8');
}

/* 文本 → 要点键 的模糊匹配：先按键名包含，再按别名兜底（康复清单里的口语化写法） */
function tipKeyOf(text) {
  const t = String(text == null ? '' : text);
  const KEYS = Object.keys(ACTION_TIPS);
  // 1) 文本直接包含键名（如「自重深蹲 3 组」命中「自重深蹲」）
  const hit = KEYS.filter(function (k) { return t.indexOf(k) >= 0; })[0];
  if (hit) return hit;
  // 2) 别名兜底
  const ALIAS = [
    ['抓毛巾', ['抓毛巾']],
    ['足底滚压', ['足底滚动', '滚动', '滚压', '筋膜球', '网球']],
    ['平板支撑', ['平板']],
    ['俯卧YW伸展', ['YW', 'Y-W']],
    ['俯卧超人式', ['超人']]
  ];
  for (let i = 0; i < ALIAS.length; i++) {
    const k = ALIAS[i][0], ws = ALIAS[i][1];
    for (let j = 0; j < ws.length; j++) { if (t.indexOf(ws[j]) >= 0) return k; }
  }
  return null;
}

    const target = Math.max(1, Math.round((reduced ? reduceTarget(base, a.unit) : base) * rehabFactor() * deloadFactor())); // FR-J 复训叠加+减载周自动降量（周期驱动课表核心断点）
    const timed = a.unit.indexOf('秒') >= 0;

    for (let s = 1; s <= st; s++) {
      c.push({ kind: 'pre', actionIdx: i, set: s, name: a.name });
      c.push({ kind: 'set', actionIdx: i, set: s, name: a.name, unit: a.unit, target: target, timed: timed, secs: timed ? target : 0 });

    if (wk.left <= 10 && wk.left > 0 && !wk.spoken10) { wk.spoken10 = true; SPEAK('还剩10秒'); }
    if (wk.left <= 0) { completeSet(); return; }
  } else if (p.kind === 'set') { // 次数类：正计时+30秒语音催一次，手动完成（不代跳，防假记录）
    if (passed >= 30 && !wk.spoken30) { wk.spoken30 = true; SPEAK('做完了就点完成本组'); }
  }
  renderWorkout();
}
function completeSet() {
  if (!wk || wk.mode !== 'course') return;
  const p = wk.course[wk.ci];
  if (p.kind !== 'set') return;
  SPEAK('本组完成');
  wk.setsDone[p.actionIdx]++;
  wkAdvance();
}
function skipRest() {
  if (wk && wk.mode === 'course' && wk.course[wk.ci].kind === 'rest') { SPEAK('继续'); wkAdvance(); }
}
function warmDone() { if (wk && wk.mode === 'course' && wk.course[wk.ci].kind === 'warm') { SPEAK('热身完成'); wkAdvance(); } }
function exitWorkout() {
  if (!wk) return;
  showModal('<div class="card-title" style="margin-bottom:8px">结束训练？</div>'
    + '<div class="body-tx">已完成的动作会预填到记录表单（未完成的不勾选），时长按实际训练时间计算。</div>'
    + '<div class="m-actions"><button class="btn-primary" onclick="closeModal();finishWorkout()">结束并预填</button>'
    + '<button class="btn-ghost" onclick="closeModal()">继续训练</button></div>');
}
function finishWorkout() {
  if (!wk) return;
  clearInterval(wk.timer);
  releaseWakeLock(); // 训练结束，交还系统息屏策略
  const mins = Math.max(1, Math.round((Date.now() - wk.startTs - wk.pausedTotal) / 60000));
  const kind = wk.kind;
  const mode = wk.mode;
  const done = (mode === 'course') ? wk.setsDone.map((n, i) => n >= (wk.setsPer ? wk.setsPer[i] : 3)) : null;
  const setsDone = (mode === 'course') ? wk.setsDone.reduce((a, b) => a + b, 0) : 0;
  const totalSets = (mode === 'course') ? wk.totalSets : 0;
  const yellow = (mode === 'course') ? wk.yellow : false;
  const lastPerf = (mode === 'course') ? wk.lastPerf : '';
  const log = D.state.progressionLog || [];
  const progTxt = log.length ? log[log.length - 1].what.split('、')[0] : null; // 上期渐进示例（历史事实，非本次预测）
  wk = null;
  document.getElementById('workout').hidden = true;
  nav('pgToday');
  tfType(kind); // nav 重建页面后再设类型，避免被 prefill 重置
  if (kind === '力量' && done) {
    for (let i = 0; i < done.length; i++) tf.checks[i] = !!done[i];
    const pc = document.getElementById('planCard');
    if (pc) pc.innerHTML = planHtml(); // 让已完成动作的勾选状态立即可见
  }
  const fd = document.getElementById('fDur');
  if (fd) fd.value = mins;
  setRpeUI(5); // 滑块与文字一起重置为建议默认 5，用户按真实体感拖动确认
  if (kind === '力量' && mode === 'course' && setsDone > 0) {
    showWorkoutReport({ mins: mins, setsDone: setsDone, totalSets: totalSets, yellow: yellow, progTxt: progTxt });
  } else { // v4.1 好用度修复：有氧/长时也出课结报告（正反馈闭环不断裂）
    const cname = (kind === '有氧' && tf.cardioChoice) ? tf.cardioChoice : kind;
    showWorkoutReport({ mins: mins, setsDone: 1, totalSets: 1, yellow: false, progTxt: progTxt, soloLabel: cname });
  }
}
/* N2 课结报告卡：全勤标记 + 四大数字 + RPE + 主观状态 → 一键保存（走统一保存链） */
function showWorkoutReport(d) {
  window.__wrMood = '';
  window.__wrFeel = '';      // v3.3：训练感受三键（轻松/刚好/很累）
  window.__wrPain = '无';    // v3.3：疼痛部位点选，默认无
  const isSolo = !!d.soloLabel;
  const full = d.setsDone >= d.totalSets;
  const badge = isSolo
    ? '<div class="wr-badge" style="background:var(--green)"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="card-title" style="text-align:center">完成 · ' + U.esc(d.soloLabel) + '</div>'
    : (full
    ? '<div class="wr-badge" style="background:var(--green)"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="card-title" style="text-align:center">全部完成</div>'
    : '<div class="wr-badge" style="background:var(--orange)"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg></div><div class="card-title" style="text-align:center">完成 ' + d.setsDone + ' / ' + d.totalSets + ' 组</div>');
  const prog = d.progTxt ? U.esc(d.progTxt) : '首期';
  const big = (v, l) => '<div class="wr-num"><div class="wr-v">' + v + '</div><div class="wr-l">' + l + '</div></div>';
  showModal('<div style="text-align:center">' + badge + '</div>'
    + '<div class="wr-grid">'
    + big(d.mins + '<span style="font-size:13px;font-weight:400"> 分钟</span>', '实际时长')
    + big(isSolo ? '✓' : d.setsDone + '/' + d.totalSets, isSolo ? '今天这一练' : '完成组数')
    + big('<span style="font-size:14px">' + prog + '</span>', '当前目标（上期调整）')
    + big('第 ' + weekTrainNo() + ' 练', '本周')
    + '</div>'
    + (d.yellow ? '<div class="sub" style="color:var(--orange);margin-bottom:6px">已按黄灯自动减量 30%（估算）。</div>' : '')
    + '<div class="sub" style="margin-bottom:6px">先点感受（自动定 RPE，可再微调）；保存后按 RPE 自动渐进：≤7 上调 / 8 持平 / ≥9 减10%</div>'
    + '<div class="field"><label>训练感受</label><div class="chips" id="wrFeelChips">' + wrFeelChips() + '</div></div>'
    + '<div class="field"><label>体感强度 RPE（1-10，可微调）<span id="wrRpeVal" style="float:right;color:var(--accent);font-weight:600">RPE 5</span></label>'
    + '<input id="wrRpe" type="range" min="1" max="10" step="1" value="5" oninput="wrSetRpe(this.value)"></div>'
    + '<div class="field"><label>主观状态</label><div class="chips" id="wrMoodChips"></div></div>'
    + '<div class="field"><label>疼痛部位（如实点选）</label><div class="chips" id="wrPainChips">' + wrPainChips() + '</div></div>'
    + '<input id="wrPainSpot" placeholder="疼的部位/感觉描述（如：右足底走多了微酸）" style="display:none;margin-bottom:8px">'
    + '<div class="m-actions"><button class="btn-primary" onclick="saveFromReport()">保存并结束</button>'
    + '<button class="btn-ghost" onclick="closeModal();toast(\'已预填，请到记录卡核对保存\')">稍后自己填</button></div>');
  renderWorkoutMoodChips();
}
function renderWorkoutMoodChips() {
  const el = document.getElementById('wrMoodChips');
  if (el) el.innerHTML = CONFIG.moods.map((m) => '<button class="chip' + (window.__wrMood === m ? ' on' : '') + '" onclick="wrSetMood(\'' + m + '\')">' + m + '</button>').join('');
}
function wrSetRpe(v) { const r = document.getElementById('wrRpe'); if (r) r.value = v; const t = document.getElementById('wrRpeVal'); if (t) t.textContent = 'RPE ' + v; }
function wrSetMood(m) { window.__wrMood = m; renderWorkoutMoodChips(); }
/* v3.3 训练感受三键：一键定 RPE（轻松=6 有余力上调 / 刚好=8 持平 / 很累=9 减10%），滑块仍可微调 */
const WR_FEELS = [['轻松', 6], ['刚好', 8], ['很累', 9]];
function wrFeelChips() {
  return WR_FEELS.map((f) => '<button class="chip' + (window.__wrFeel === f[0] ? ' on' : '') + '" onclick="wrSetFeel(\'' + f[0] + '\')">' + f[0] + '</button>').join('');
}
function wrSetFeel(f) {
  const hit = WR_FEELS.find((x) => x[0] === f);
  window.__wrFeel = f;
  if (hit) wrSetRpe(hit[1]);
  const el = document.getElementById('wrFeelChips');
  if (el) el.innerHTML = wrFeelChips();
}
function wrPainChips() { // 与记录表单 CONFIG.painOptions 同一套口径的快速子集，'其他'展开描述框
  return ['无', '右足底', '右踝', '其他'].map((p) => '<button class="chip' + (window.__wrPain === p ? ' on' : '') + '" onclick="wrSetPain(\'' + p + '\')">' + p + '</button>').join('');
}
function wrSetPain(p) {
  window.__wrPain = p;
  const el = document.getElementById('wrPainChips');
  if (el) el.innerHTML = wrPainChips();
  const s = document.getElementById('wrPainSpot');
  if (s) s.style.display = (p === '其他') ? 'block' : 'none';
}
function saveFromReport() { // 把报告卡的 RPE/状态写进已预填的表单，走统一保存链（含渐进/灯色/同步）
  const r = U.num((document.getElementById('wrRpe') || {}).value);
  if (r == null || r < 1 || r > 10) { toast('请先点训练感受（或拖动 RPE）'); return; }
  if (!window.__wrFeel) { toast('请选择训练感受（轻松/刚好/很累）'); return; }
  if (!window.__wrMood) { toast('请选择主观状态'); return; }
  if (window.__wrPain === '其他' && !((document.getElementById('wrPainSpot') || {}).value || '').trim()) { toast('疼痛选了"其他"，请写一句部位/感觉'); return; }
  setRpeUI(r);
  tf.mood = window.__wrMood;
  setPain(window.__wrPain); // 与表单疼痛链共用 setPain：同步 tf.painOpt + chips + fPainText 显隐
  if (window.__wrPain === '其他') {
    const spot = document.getElementById('wrPainSpot').value.trim();
    const pp = document.getElementById('fPainText');
    if (pp) pp.value = spot; // saveDaily 从 fPainText 读"其他"文本
    tf.painText = spot;
  }
  tf.fromWorkout = true; // 跟练流保存：部分完成不拦截，照实记录
  closeModal();
  tfSave();
}
function renderWorkout() {
  const el = document.getElementById('wkBody');
  if (!el || !wk) return;
  const clock = (s) => Math.floor(s / 60) + ':' + U.pad(s % 60);
  if (wk.mode !== 'course') { // 有氧/长时：单动作正计时
    const it = wk.list[wk.idx];
    const C0 = 2 * Math.PI * 96;
    el.innerHTML = '<div class="wk-name">' + U.esc(it.name) + '</div>'
      + '<div class="wk-set">低强度持续输出 · 全程能说话' + (wk.targetDur ? ' · 建议 ' + wk.targetDur : '') + '</div>'
      + '<div class="wk-ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" style="stroke:var(--line)" stroke-width="10"/><circle cx="110" cy="110" r="96" fill="none" style="stroke:var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C0 * Math.min(1, (wk.elapsed % 60) / 60)).toFixed(1) + ' ' + C0.toFixed(1) + '" transform="rotate(-90 110 110)"/></svg>'
      + '<div class="wt">' + clock(wk.elapsed) + '</div></div>'
      + '<div class="wk-btns"><button class="btn-primary" onclick="finishWorkout()">完成训练</button>'
      + '<button class="btn-ghost" onclick="pauseWorkout()">' + (wk.pausedAt ? '继续' : '暂停') + '</button>'
      + '<button class="btn-ghost" onclick="exitWorkout()">结束训练</button></div>'
      + (wk.pausedAt ? '<div class="sub" style="margin-top:12px">已暂停</div>' : '');
    return;
  }
  const p = wk.course[wk.ci];
  const doneSets = wk.setsDone.reduce((a, b) => a + b, 0);
  const bar = '<div class="wk-bar"><div style="width:' + Math.round(100 * doneSets / wk.totalSets) + '%"></div></div>';
  const pauseBtn = '<button class="btn-ghost" onclick="' + (wk.pausedAt ? 'resumeWorkout()' : 'pauseWorkout()') + '">' + (wk.pausedAt ? '继续' : '暂停') + '</button>';
  let h = '';
  if (p.kind === 'warm') {
    h = bar + '<div class="wk-name">热身</div><div class="wk-tip">' + U.esc(CONFIG.warmup) + '</div>'
      + '<div class="wk-ring" style="width:170px;height:170px"><div class="wt" style="font-size:38px">' + clock(wk.elapsed) + '</div></div>'
      + '<div class="wk-btns"><button class="btn-primary" onclick="warmDone()">热身完成，开始力量训练</button>' + pauseBtn + '<button class="btn-ghost" onclick="exitWorkout()">结束训练</button></div>';
  } else if (p.kind === 'pre') {
    h = bar + '<div class="wk-set">预备 · ' + U.esc(p.name) + ' · 第 ' + p.set + ' 组</div>'
      + '<div style="font-size:96px;font-weight:700;line-height:1">' + wk.left + '</div>'
      + '<div class="wk-btns" style="margin-top:30px"><button class="btn-ghost" onclick="exitWorkout()">结束训练</button></div>';
  } else if (p.kind === 'set') {
    const a = CONFIG.actions[p.actionIdx];
    const frac = p.timed ? Math.max(0, Math.min(1, wk.left / Math.max(1, p.secs))) : Math.min(1, (wk.elapsed % 60) / 60);
    const C = 2 * Math.PI * 96;
    const shown = p.timed ? wk.left : clock(wk.elapsed);
    h = bar + '<div class="wk-name">' + U.esc(p.name) + '</div>'
      + '<div class="wk-set">第 ' + p.set + ' 组 / 共 ' + (wk.setsPer ? wk.setsPer[p.actionIdx] : 3) + ' 组 · ' + U.esc(a.part) + (wk.yellow ? ' · <span style="color:var(--orange)">黄灯减量中</span>' : '') + '</div>'
      + '<div class="wk-ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" style="stroke:var(--line)" stroke-width="10"/>'
      + '<circle cx="110" cy="110" r="96" fill="none" style="stroke:var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 110 110)"/></svg>'
      + '<div class="wt">' + shown + (p.timed ? '<span style="font-size:14px;color:var(--text2)"> 秒</span>' : '') + '</div></div>'
      + (p.timed ? '' : '<div class="wk-goal" style="margin-top:6px">目标 ' + p.target + ' ' + U.esc(p.unit) + '</div>')
      + '<div class="wk-tip" style="margin:2px 0 16px">' + U.esc(wk.lastPerf) + '</div>'
      + '<div class="wk-btns"><button class="btn-primary" onclick="completeSet()">完成本组</button>' + pauseBtn + '<button class="btn-ghost" onclick="exitWorkout()">结束训练</button></div>'
      + '<div class="wk-tip" style="margin-top:10px">' + U.esc(a.guide) + '</div>'
      + (function () { // 最终版批3⑩：组执行时的"之后"预告（不碰计时，纯渲染）
          const nx = wk.course.slice(wk.ci + 1).find((q) => q.kind === 'set');
          return '<div class="wk-tip" style="color:var(--text2)">之后：' + (nx ? U.esc(nx.name) + ' 第 ' + nx.set + ' 组' : '放松拉伸，就收工') + '</div>';
        })();
  } else if (p.kind === 'rest') {
    const frac = Math.max(0, Math.min(1, wk.left / (wk.phaseDur || 60)));
    const C = 2 * Math.PI * 96;
    h = bar + '<div class="wk-name">休息</div><div class="wk-set">下一个：' + U.esc(p.nextName) + ' · 第 ' + p.nextSet + ' 组</div>'
      + '<div class="wk-ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" style="stroke:var(--line)" stroke-width="10"/>'
      + '<circle cx="110" cy="110" r="96" fill="none" style="stroke:var(--orange)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 110 110)"/></svg>'
      + '<div class="wt">' + wk.left + '<span style="font-size:14px;color:var(--text2)"> 秒</span></div></div>'
      + '<div class="wk-btns"><button class="btn-primary" onclick="skipRest()">跳过休息</button></div>';
  } else { // cooldown 放松
    h = bar + '<div class="wk-name">放松</div><div class="wk-tip">' + U.esc(CONFIG.cooldown) + '</div>'
      + '<div class="wk-ring" style="width:170px;height:170px"><div class="wt" style="font-size:38px">' + clock(wk.elapsed) + '</div></div>'
      + '<div class="wk-btns"><button class="btn-primary" onclick="finishWorkout()">完成训练</button>' + pauseBtn + '<button class="btn-ghost" onclick="exitWorkout()">结束训练</button></div>';
  }
  if (wk.pausedAt) h += '<div style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:46;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px"><div class="wk-name" style="color:#fff">已暂停</div><button class="btn-primary" style="max-width:220px" onclick="resumeWorkout()">继续训练</button><button class="btn-ghost" style="max-width:220px;background:transparent" onclick="resumeWorkout();exitWorkout()">结束训练</button></div>';
  el.innerHTML = h;
}

/* ============ 启动 ============ */
function bindUI() {
  document.getElementById('btnUnlock').onclick = () => tryUnlock();
  document.getElementById('gateKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  document.getElementById('btnOffline').onclick = () => enterOffline();
  document.getElementById('btnProfile').onclick = () => nav('pgProfile');
  const bs = document.getElementById('btnSave');
  if (bs) bs.onclick = () => tfSave(); // 保存按钮由 renderToday 动态渲染，静态期可能不存在
  document.getElementById('bfSave').onclick = () => saveBackfill();
  document.getElementById('bfSkip').onclick = () => skipBackfill();
  document.getElementById('bfBackBtn').onclick = () => closeBackfill();
  document.querySelectorAll('#tabbar .tab').forEach((b) => { b.onclick = () => nav(b.getAttribute('data-pg')); });
  const mw = document.getElementById('modalWrap'); if (mw) mw.addEventListener('click', (e) => { if (e.target.id === 'modalWrap') closeModal(); }); // v4.1 好用度：遮罩点击关
  document.addEventListener('focusin', (e) => { const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && t.type !== 'range') { setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {} }, 280); } }); // v4.1 UX 补缺：键盘弹出防遮挡
  window.addEventListener('popstate', (e) => { if (e.state && e.state.pg) nav(e.state.pg); }); // v4.1：右滑返回切回上一 tab
  document.getElementById('modalWrap').onclick = (e) => { if (e.target.id === 'modalWrap') closeModal(); };
  // 同步时机=切回前台（不做后台定时同步）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && D && D.state.pendingSync && TOKEN && !readOnly) pushNow();
  });
}
async function init() {
  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) {}
  }
  bindUI();
  try {
    await DB.open();
    const saved = await DB.load();
    D = saved ? normalizeData(saved) : defaultData();
  } catch (e) {
    D = defaultData(); // 本地数据异常兜底：保证应用可启动，不白屏
  }
  rebuildSched(); // N5：恢复自定义课表生效缓存
  applyTheme();
  updateSyncBadge();
  let savedKey = null;
  try { savedKey = sessionStorage.getItem('tineng_key'); } catch (e) {}
  if (savedKey) {
    document.getElementById('gateKey').value = savedKey;
    tryUnlock();
  }
}
document.addEventListener('DOMContentLoaded', init);


</script>
